<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3V3 回合制 · 单机/联机/Boss</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:10px;font-family:"Microsoft YaHei",Arial,sans-serif;background:#0f1220;color:#e8e8f0;min-height:100vh}
h1{font-size:17px;text-align:center;color:#9fd3ff;margin:4px 0 2px}
.author{text-align:center;font-size:11px;color:#7f89ad;margin-bottom:10px}
.panel{background:#171b2e;border:1px solid #2a3150;border-radius:12px;padding:10px;margin-bottom:10px}
.side-title{font-size:13px;font-weight:bold;margin-bottom:6px;color:#8fb8ff}
.side-title.blue{color:#ff8fc8}
.side-title.boss{color:#ff6d6d}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
input{flex:1;min-width:120px;background:#101426;border:1px solid #2b3352;color:#e8e8f0;border-radius:8px;padding:10px;font-size:16px}
button{background:#2e3966;border:1px solid #5d6ba8;color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
button:disabled{opacity:.35}
.mode-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.mode-btns button{flex:1;min-width:100px;padding:16px;font-size:15px;font-weight:bold;background:#2e6b4a;border:1px solid #4fbf80}
.mode-btns button.online{background:#3a2340;border-color:#7a3d86}
.mode-btns button.bossmode{background:#5c2d2d;border-color:#a84a4a}
.select-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.pick-card{background:#202642;border:2px solid #2f3860;border-radius:10px;padding:10px;cursor:pointer;transition:.15s;position:relative}
.pick-card.selected{border-color:#63ff9c;box-shadow:0 0 12px rgba(99,255,156,.5);background:#1d3328}
.pick-card .name{font-weight:bold;font-size:14px;margin-bottom:2px}
.pick-card .type{font-size:10px;padding:1px 6px;border-radius:999px;background:#2d365c;color:#a8c4ff;display:inline-block;margin-bottom:4px}
.pick-card .desc{font-size:10px;color:#9aa4c8;line-height:1.4}
.pick-card .check{position:absolute;top:6px;right:8px;font-size:16px;color:#63ff9c;display:none}
.pick-card.selected .check{display:block}
.start-btn{width:100%;padding:14px;font-size:16px;font-weight:bold;background:#2e6b4a;border:1px solid #4fbf80;color:#b8ffd8;border-radius:10px;cursor:pointer}
.start-btn:disabled{opacity:.35;background:#232b4d;border-color:#3b4675;color:#7f89ad}
.card{background:#202642;border:2px solid #2f3860;border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer;transition:.15s}
.card.blue{background:#261c33;border-color:#3d2a4a}
.card.boss{background:#2a1420;border:3px solid #a84a4a;padding:12px;cursor:pointer}
.card.boss.selected{border-color:#ffd35c;box-shadow:0 0 12px rgba(255,211,92,.6)}
.card.dead{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.card.selected{border-color:#ffd35c;box-shadow:0 0 10px rgba(255,211,92,.5)}
.card.active{border-color:#63ff9c;box-shadow:0 0 10px rgba(99,255,156,.5)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.name{font-weight:bold;font-size:14px}
.type{font-size:10px;padding:1px 6px;border-radius:999px;background:#2d365c;color:#a8c4ff}
.bar{height:9px;background:#101426;border-radius:999px;overflow:hidden;margin:3px 0;border:1px solid #2b3352}
.bar-inner{height:100%;transition:width .25s}
.hp .bar-inner{background:linear-gradient(90deg,#43e97b,#38f9d7)}
.card.boss .bar.hp .bar-inner{background:linear-gradient(90deg,#ff6d6d,#ffb86d)}
.rage .bar-inner{background:linear-gradient(90deg,#ffd200,#f7971e)}
.ki .bar-inner{background:linear-gradient(90deg,#a855f7,#ec4899)}
.stats{display:flex;justify-content:space-between;font-size:11px;color:#9aa4c8;margin-top:2px;flex-wrap:wrap;gap:4px}
.status-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.tag{font-size:9px;padding:1px 5px;border-radius:4px;background:#3a2d5c;color:#d7c6ff}
.tag.stun{background:#5c3a2d;color:#ffd7a8}
.tag.form{background:#4a2d5c;color:#ffa8f0}
.tag.revive{background:#2d5c4a;color:#a8ffd7}
.tag.blood{background:#5c2d3a;color:#ffb8d7}
.tag.noa{background:#2d3a5c;color:#a8c8ff}
.tag.maho{background:#5c2d2d;color:#ffb8b8}
.tag.erosion{background:#2d5c3a;color:#a8ffb8}
.tag.build{background:#2d4a5c;color:#a8e8ff;border:1px solid #5d9ba8}
.tag.riika{background:#4a1a2a;color:#ffa8c8;border:1px solid #a83d5c}
.tag.zaki{background:#4a2d2d;color:#ff8f8f;border:1px solid #a84a4a}
.tag.ooo{background:#2d4a2d;color:#a8ff8f;border:1px solid #4a8c4a}
.tag.berserk{background:#8c2d2d;color:#ffa8a8;border:1px solid #ff6d6d;animation:pulse 1s infinite}
.tag.sz{background:#5c2d4a;color:#ffb8ff;border:1px solid #a84a8c}
.tag.noheal{background:#5c1a1a;color:#ff8f8f;border:1px solid #ff6d6d}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.5;}100%{opacity:1;}}
.log{height:120px;overflow-y:auto;background:#11152a;border:1px solid #262e4f;border-radius:10px;padding:8px;font-size:12px;line-height:1.5;margin-bottom:10px}
.log div{color:#b8c4e8}
.log .damage{color:#ff9f9f}
.log .heal{color:#9fffb8}
.log .info{color:#9fd3ff}
.log .warn{color:#ffd35c}
.log .passive{color:#c084fc}
.log .revive{color:#6dffb8}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{flex:1;min-width:90px;font-size:12px;padding:10px 8px}
.btns button.ult{background:#3a2340;border-color:#7a3d86}
.hint{font-size:11px;color:#7f89ad;margin-top:6px;text-align:center}
.result{text-align:center;font-size:22px;font-weight:bold;padding:12px;border-radius:12px;margin-top:10px;display:none}
.result.win{background:#143d28;color:#6dff9c;display:block}
.result.lose{background:#3d1414;color:#ff6d6d;display:block}
.hidden{display:none}
.room-code{font-size:22px;font-weight:bold;color:#ffd35c;text-align:center;margin:8px 0;letter-spacing:6px}
.status-msg{text-align:center;color:#9fd3ff;font-size:13px;margin:6px 0;min-height:18px}
#summonModal,#copyModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100;padding:20px}
#summonModal.show,#copyModal.show{display:flex}
.modal-box{background:#171b2e;border:2px solid #5d6ba8;border-radius:12px;padding:14px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal-box h3{margin:0 0 10px;font-size:15px;color:#9fd3ff}
.modal-box .shiki-btn{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;font-size:12px;background:#232b4d;border:1px solid #3b4675}

</head>
<body>
<h1>回合制战斗</h1>
<div class="author">作者：蒋凌霄</div>

<div id="menuScreen">
  <div class="panel">
    <div class="side-title">选择游戏模式</div>
    <div class="mode-btns">
      <button id="singleBtn" style="flex:100%">单机PVP</button>
      <button id="bossBrolyBtn" class="bossmode" style="flex:1">单机Boss·布罗利</button>
      <button id="bossShengzhuBtn" class="bossmode" style="flex:1;background:#5c1a1a;border-color:#ff6d6d;color:#ffb8b8">单机Boss·圣主</button>
      <button id="onlineBtn" class="online" style="flex:100%">联机模式</button>
    </div>
    <div class="hint" style="margin-top:10px">联机包含：PVP / Boss合作</div>
    <div class="status-msg" id="initMsg"></div>
  </div>
</div>

<div id="singleSelectScreen" class="hidden">
  <div class="panel">
    <div class="side-title" id="singleSelectTitle">选择你的 3 名角色</div>
    <div class="status-msg" id="singleSelectInfo">已选 0 / 3</div>
    <div class="select-grid" id="singleSelectGrid"></div>
    <button class="start-btn" id="singleStartBtn" disabled>开始战斗</button>
    <div class="hint" id="singleHint">AI 使用你未选择的角色</div>
    <button id="backFromSingle" style="margin-top:8px;width:100%">返回</button>
  </div>
</div>

<div id="onlineLobbyScreen" class="hidden">
  <div class="panel">
    <div class="side-title">联机模式</div>
    <div class="row"><button id="pvpBtn" style="width:100%">创建 PVP 房间（各选3角色）</button></div>
    <div class="row" style="margin-top:8px"><button id="bossCoopBtn" style="width:100%;background:#5c2d2d;border-color:#a84a4a">创建 Boss合作 房间（各选1角色）</button></div>
    <div class="row" style="margin-top:8px">
      <input id="roomInput" placeholder="输入4位房间码" maxlength="4">
      <button id="joinBtn">加入</button>
    </div>
    <div class="status-msg" id="lobbyMsg"></div>
    <button id="backFromLobby" style="margin-top:8px;width:100%">返回</button>
  </div>
</div>

<div id="onlineSelectScreen" class="hidden">
  <div class="panel">
    <div class="room-code" id="roomIdDisplay"></div>
    <div class="side-title" id="onlineSideTitle">选择你的角色</div>
    <div class="status-msg" id="onlineSelectInfo">已选 0 / 0</div>
    <div class="select-grid" id="onlineSelectGrid"></div>
    <button class="start-btn" id="onlineConfirmBtn" disabled>确认选择</button>
    <div class="hint" id="onlineWaitHint">等待对方...</div>
  </div>
</div>

<div id="battleScreen" class="hidden">
  <div class="panel" id="bossPanel" style="display:none">
    <div class="side-title boss" id="bossTitle">Boss</div>
    <div id="bossCards"></div>
  </div>
  <div class="panel"><div class="side-title">红方</div><div id="redCards"></div><div id="redSummons"></div></div>
  <div class="panel" id="blueSidePanel"><div class="side-title blue">蓝方</div><div id="blueCards"></div><div id="blueSummons"></div></div>
  <div class="log" id="log"></div>
  <div class="panel">
    <div id="actionTitle" style="font-size:13px;font-weight:bold;margin-bottom:8px;color:#9fd3ff">等待行动...</div>
    <div class="btns" id="skillButtons"></div>
    <div class="hint" id="hint">点击目标选人，再点技能</div>
    <button id="backToMenu" style="margin-top:8px;width:100%">结束本局</button>
  </div>
  <div class="result" id="result"></div>
</div>

<div id="summonModal">
  <div class="modal-box">
    <h3>选择召唤的式神</h3>
    <div id="summonList"></div>
    <button onclick="closeSummonModal()" style="width:100%;margin-top:8px;background:#5c2d2d;border-color:#a84a4a">取消</button>
  </div>
</div>

<div id="copyModal">
  <div class="modal-box">
    <h3>选择复制术式</h3>
    <div id="copyList"></div>
    <button onclick="closeCopyModal()" style="width:100%;margin-top:8px;background:#5c2d2d;border-color:#a84a4a">取消</button>
  </div>
</div>

function aliveList(b, side){ return b[side].filter(c => c.hp > 0); }
function findChar(b, key){
  if(key === 'boss') return b.boss;
  const [s,i]=key.split('_'); return b[s][parseInt(i)];
}
function gainRage(c,n){ if(!c || c.hp<=0) return; c.rage = clamp(c.rage + n, 0, c.maxRage); }
function addStatus(t,id,name,dur){
  if(!t || !t.statuses || t.isBoss) return;
  const e=t.statuses.find(s => s.id===id);
  if(e) e.dur = Math.max(e.dur, dur);
  else t.statuses.push({id,name,dur});
}
function addStatusSafe(t, id, name, dur){
  if(t.isNoa && t.noaLight > 0) return;
  if(t.isYuta && t.riikaTurns > 0) return;
  if(t.isBoss) return;
  addStatus(t, id, name, dur);
}
function endTurnStatuses(c){
  if(!c || !c.statuses) return;
  c.statuses.forEach(s => { if(s.dur>0) s.dur--; });
  c.statuses = c.statuses.filter(s => s.dur>0);
  if(c.isYuji && c.ritualLock>0) c.ritualLock--;
  if(c.passiveDisabled > 0) c.passiveDisabled--;
  if(c.isBuild) {
    for(let k in c.bestMatchCd) {
      if(c.bestMatchCd[k] > 0) c.bestMatchCd[k]--;
    }
  }
  if(c.isYuta) {
    if(c.riikaTurns > 0) c.riikaTurns--;
    if(c.yutaDomainTurns > 0) c.yutaDomainTurns--;
    if(c.riikaTurns === 0) c.copiedUltUsed = false;
  }
  if(c.isZaki) {
    if(c.zakiDestoryTurns > 0) c.zakiDestoryTurns--;
    if(c.zakiDomainTurns > 0) c.zakiDomainTurns--;
  }
  if(c.isBoss && c.id==='boss_shengzhu' && c.critTurns > 0) c.critTurns--;
}
function addBattleLog(b, msg, cls){
  b.logs = b.logs || [];
  b.logs.push({msg, cls, t:Date.now()});
  if(b.logs.length > 80) b.logs.shift();
}
function isPassiveDisabled(c){ 
  return (c.passiveDisabled||0) > 0 || (c.statuses && c.statuses.some(s => s.id === 'passive_seal' && s.dur > 0)); 
}
function hasNoHeal(c) {
  return c && c.statuses && c.statuses.some(s => s.id === 'noHeal' && s.dur > 0);
}

function hasNue(b, owner){
  if(!b.summons) return false;
  return b.summons.some(s => s.hp>0 && s.ownerKey===owner.key && s.shikiId==='nue');
}

function checkBerserk(actor) {

    if (actor.oooSkillCount >= 2) {

      } else {
        actor.oooSkillCount = 0; 
      }
    }
  }
}

function calcDamage(att, def, skill, extra={}){
  let base = skill.dmg + (att.atkBonus||0);
  if(att.isOOO) base += 5;
  if(att.isOOO && att.isBerserk) base += 30;
  
  if (att.isBoss && att.id === 'boss_shengzhu') {
      base += 35;
      if (att.critTurns > 0) base = Math.floor(base * 1.25);
      const marks = def.marks || 0;
      base = Math.floor(base * (1 + marks * 0.22));
  }

  if(att.statuses && att.statuses.some(s => s.id==='broken')) base = Math.max(0, base-10);
  if(skill.id==='s2' && def.hp < def.maxHp*0.5) base += 20;
  if(skill.id==='ult2' && extra.hadShield) base += 30;
  if(skill.id==='ult1' && att.form==='blue') base += 20;
  if(att.isGoku){
    if(skill.id==='s2' && def.statuses && def.statuses.length>0) base += 15;
    if(skill.id==='ult1' && att.silverAwakened) base += 30;
    if(skill.id==='ult2' && att.hp < att.maxHp*0.4) base += 20;
  }
  if(att.isGatan && skill.gatanClaw && att.gatanDomainTurns > 0) base += 20;
  if(att.isGatan && skill.gatanTentacle && att.gatanDomainTurns > 0) base += 10;
  if(att.isYuta && att.riikaTurns > 0) base += 10;
  if(att.isZaki && skill.zakiBasic) base += att.zakiAtkBonus;
  if(skill.negativeBonus && def.statuses && def.statuses.length>0) base += skill.negativeBonus;
  let bonusPercent = (att.dmgBonus||0);
  if(att.isVegito && att.kiFlame>0) bonusPercent += att.kiFlame*5;
  base = Math.floor(base * (1 + bonusPercent/100));
  if(skill.ult && att.isVegito && att.kiFlame>=3) base = Math.floor(base*1.2);

  if(def.statuses && def.statuses.some(s => s.id==='frozen')) base = Math.floor(base * 1.5);

  if(skill.dtype==='true') return {final:base, trueDamage:true, absorb:0};

  let reduce = def.dmgReduce||0;
  if(def.isGatan){ reduce += 10; if(def.gatanDomainTurns > 0) reduce += 5; }
  if(def.isNoa && def.noaLight > 0) reduce += def.noaLight * 5;
  if(def.isFushiguro && def.shadowHide > 0) reduce += 12;
  if(def.isFushiguro && def.fushiDomainTurns > 0) reduce += 18;
  if(def.isFushiguro && hasNue({summons: extra.summons}, def)) reduce += 10;
  if(def.statuses && def.statuses.some(s => s.id==='focus')) reduce += 10;
  if(def.statuses && def.statuses.some(s => s.id==='redScale')) reduce += 40;
  base = Math.floor(base*(1-reduce/100));
  let absorb = 0;
  if(!skill.ignoreShield) absorb = Math.min(def.shield, base);
  return {final:base-absorb, trueDamage:false, absorb};
}

function tryDodge(b, def, skill){
  if(!def.isGoku || def.hp<=0) return false;
  if(isPassiveDisabled(def)) return false;
  if(skill.noDodge) return false;
  if(rnd() < def.dodgeRate){
    def.dodgedThisTurn = true;
    gainRage(def, 10);
    def.atkBonus = (def.atkBonus||0) + 5;
    addBattleLog(b, `【${def.name}】闪避！+10怒，攻击+5`, 'passive');
    return true;
  }
  return false;
}

function petrifyTick(b, gatan){
  if(!gatan.isGatan) return;
  const enemySide = gatan.side==='red' ? 'blue' : 'red';
  aliveList(b, enemySide).forEach(t => {
    if(t.petrify > 0){
      const dmg = t.petrify * 15;
      t.hp = Math.max(0, t.hp - dmg);
      addBattleLog(b, `邪神力量：${t.name} 石化${t.petrify}层，受 ${dmg} 真伤`, 'damage');
      const steal = t.petrify * 5;
      const actualSteal = Math.min(t.rage, steal);
      t.rage -= actualSteal;
      gatan.rage = Math.min(gatan.maxRage, gatan.rage + actualSteal);
      if(actualSteal > 0) addBattleLog(b, `邪神力量：偷取 ${t.name} ${actualSteal} 怒气`, 'passive');
      t.petrify--;
      if(t.petrify <= 0){ t.petrify = 0; addBattleLog(b, `${t.name} 石化解除`, 'info'); }
    }
  });
  if(b.boss && b.boss.hp > 0 && b.boss.petrify > 0){
    const dmg = b.boss.petrify * 15;
    b.boss.hp = Math.max(0, b.boss.hp - dmg);
    addBattleLog(b, `邪神力量：${b.boss.name} 石化${b.boss.petrify}层，受 ${dmg} 真伤`, 'damage');
    const steal = b.boss.petrify * 5;
    const actualSteal = Math.min(b.boss.rage, steal);
    b.boss.rage -= actualSteal;
    gatan.rage = Math.min(gatan.maxRage, gatan.rage + actualSteal);
    if(actualSteal > 0) addBattleLog(b, `邪神力量：偷取${b.boss.name} ${actualSteal} 怒气`, 'passive');
    b.boss.petrify--;
    if(b.boss.petrify <= 0) { b.boss.petrify = 0; addBattleLog(b, `${b.boss.name} 石化解除`, 'info'); }
  }
  checkDeath(b);
}

function getSummonLimit(owner){
  return owner.fushiDomainTurns > 0 ? 4 : 2;
}

function summonShiki(b, owner, shikiId){
  if(!b.summons) b.summons = [];
  const limit = getSummonLimit(owner);
  const aliveTamed = b.summons.filter(s => s.ownerKey === owner.key && s.hp > 0 && s.tamed);
  if(aliveTamed.length >= limit){
    addBattleLog(b, `【${owner.name}】式神已达上限${limit}只`, 'warn');
    return;
  }
  const data = SHIKI_DB[shikiId];
  if(!data) return;
  const summon = {
    sid: 'shiki_' + Math.random().toString(36).substr(2,6),
    shikiId, name: data.name,
    hp: data.hp, maxHp: data.hp,
    dmg: data.dmg, type: data.type,
    side: owner.side, ownerKey: owner.key,
    tamed: true, deadFlag: false, statuses: [], inheritedBonus: 0
  };
  b.summons.push(summon);
  addBattleLog(b, `【${owner.name}】召唤【${data.name}】`, 'passive');
}

  }
}

function resolveShikiTurn(b, owner){
  if(!b.summons) return;
  const enemySide = owner.side==='red' ? 'blue' : 'red';
  const mySide = owner.side;
  b.summons.forEach(s => {
    if(s.hp <= 0) return;
    if(s.ownerKey !== owner.key) return;
    const data = SHIKI_DB[s.shikiId];
    if(!data) return;

    let dmgBonus = (s.inheritedBonus || 0);
    if(owner.fushiDomainTurns > 0) dmgBonus += 22;

    if(s.type === 'single' || s.type === 'bind'){
      let targets = aliveList(b, enemySide);
      if(b.isBoss && b.boss && b.boss.hp > 0) targets.push(b.boss);
      if(!targets.length) return;
      const t = targets[Math.floor(Math.random()*targets.length)];
      const dmg = s.dmg + dmgBonus;
      t.hp = Math.max(0, t.hp - dmg);
      addBattleLog(b, `【${s.name}】攻击【${t.name}】-${dmg}`, 'damage');
      if(data.bind && !t.isBoss){
        addStatus(t,'bind','束缚',1);
        if(data.cdPlus) t.skills.forEach(sk2 => { if(sk2.currentCd>0) sk2.currentCd += data.cdPlus; });
        addBattleLog(b, `【${t.name}】被束缚1回合`, 'warn');
      }
      if(data.dot && !t.isBoss){ addStatus(t,'tear','持续',3); t.dotDmg = data.dot; addBattleLog(b, `【${t.name}】持续${data.dot}/回合`, 'warn'); }
      if(data.tear && !t.isBoss){ addStatus(t,'tear','持续',3); t.dotDmg = data.tear; addBattleLog(b, `【${t.name}】撕裂${data.tear}/回合`, 'warn'); }
    } else if(s.type === 'aoe'){
      let targets = aliveList(b, enemySide);
      if(b.isBoss && b.boss && b.boss.hp > 0) targets.push(b.boss);
      targets.forEach(t => {
        const dmg = s.dmg + dmgBonus;
        t.hp = Math.max(0, t.hp - dmg);
        addBattleLog(b, `【${s.name}】全体攻击【${t.name}】-${dmg}`, 'damage');
        if(data.paralyze && !t.isBoss && rnd() < 30){ addStatus(t,'stun','麻痹',1); addBattleLog(b, `【${t.name}】麻痹`, 'warn'); }
        if(data.wet && !t.isBoss){ addStatus(t,'wet','浸湿',2); addBattleLog(b, `【${t.name}】浸湿`, 'warn'); }
      });
    } else if(s.type === 'heal'){
      const allies = [...aliveList(b, mySide), ...b.summons.filter(x=>x.hp>0 && x.tamed && x.side===mySide)];
      if(!allies.length) return;
      const t = allies.reduce((a,b2)=>a.hp<=b2.hp?a:b2);
      const heal = data.heal + dmgBonus;
      if(!hasNoHeal(t)) {
        t.hp = Math.min(t.maxHp||t.maxHp, t.hp + heal);
        addBattleLog(b, `【${s.name}】治疗【${t.name}】+${heal}`, 'heal');
      }
      if(data.cleanse && t.statuses) t.statuses = t.statuses.filter(x=>x.id==='focus'||x.id==='wet');
    }
  });

  b.summons.forEach(s => {
    if(s.hp <= 0) return;
    const data = SHIKI_DB[s.shikiId];
    if(data && data.regen) s.hp = Math.min(s.maxHp, s.hp + data.regen);
    if(data && data.selfHpCost) s.hp = Math.max(0, s.hp - data.selfHpCost);
  });

  checkShikiDeath(b);
}

function checkShikiDeath(b){
  if(!b.summons) return;
  b.summons.forEach(s => {
    if(s.hp <= 0 && !s.deadFlag){
      s.hp = 0; s.deadFlag = true;
      addBattleLog(b, `【${s.name}】式神阵亡`, 'warn');
      b.summons.forEach(other => {
        if(other.hp > 0 && other.tamed && other.ownerKey === s.ownerKey && other.sid !== s.sid){
          other.inheritedBonus = (other.inheritedBonus || 0) + 18;
          addBattleLog(b, `【${other.name}】继承力量+18`, 'passive');
        }
      });
    }
  });
}

function mahoragaTurn(b){
  if(!b.mahoraga || b.mahoraga.hp <= 0) return;
  const m = b.mahoraga;
  m.adapt = Math.min(10, (m.adapt||0) + 1);

  let targets = [];
  if(m.tamed){
    targets = aliveList(b, m.ownerSide==='red' ? 'blue' : 'red');
    if(b.isBoss && b.boss && b.boss.hp > 0 && m.ownerSide === 'red') targets.push(b.boss);
  } else {
    targets = [...aliveList(b,'red'), ...aliveList(b,'blue'), ...b.summons.filter(x=>x.hp>0)];
    if(b.isBoss && b.boss && b.boss.hp > 0) targets.push(b.boss);
  }
  if(!targets.length) return;

  let t;
  const tamedSummons = b.summons.filter(x=>x.hp>0 && x.tamed);
  if(tamedSummons.length && rnd() < 50){
    t = tamedSummons[Math.floor(Math.random()*tamedSummons.length)];
  } else {
    t = targets[Math.floor(Math.random()*targets.length)];
  }

  const dmg = 35;
  t.hp = Math.max(0, t.hp - dmg);
  addBattleLog(b, `👹 魔虚罗攻击【${t.name}】-${dmg}（适应${m.adapt}层）`, 'damage');

  checkShikiDeath(b);
  checkDeath(b);
}

function damageMahoraga(b, dmg){
  const m = b.mahoraga;
  if(!m || m.hp <= 0) return;
  const reduce = (m.adapt||0) * 10;
  const actual = Math.max(0, dmg - reduce);
  m.hp = Math.max(0, m.hp - actual);
  addBattleLog(b, `魔虚罗受 ${actual} 伤害（适应减伤${reduce}）`, 'damage');
  if(m.hp <= 0 && !m.deadFlag){
    m.deadFlag = true;
    if(!m.tamed){
      b.mahoragaTamed = true;
      addBattleLog(b, `👹 魔虚罗被击杀，永久解锁！下次召唤为友方`, 'revive');
    } else {
      addBattleLog(b, `魔虚罗被击杀`, 'warn');
    }
  }
}

function triggerNoaLight(b, actor){
  addBattleLog(b, `✨ 诺亚之光！全体10伤+封印1回合，我方回35+净化`, 'revive');
  const enemySide = actor.side==='red' ? 'blue' : 'red';
  aliveList(b, enemySide).forEach(t => {
    if(t.hp<=0) return;
    t.hp = Math.max(0, t.hp - 10);
    addStatus(t,'seal','封印',1);
  });
  if(b.isBoss && b.boss && b.boss.hp > 0){
    b.boss.hp = Math.max(0, b.boss.hp - 10);
  }
  aliveList(b, actor.side).forEach(a => {
    if(a.hp<=0) return;
    const before = a.hp;
    if(!hasNoHeal(a)) a.hp = Math.min(a.maxHp, a.hp + 35);
    if(a.hp-before>0) addBattleLog(b, `诺亚之光：${a.name} 回 ${a.hp-before}`, 'heal');
    a.statuses = a.statuses.filter(s => s.id==='focus'||s.id==='frozen'||s.id==='redScale');
  });
  actor.nextBasic = rnd() < 50 ? 'planet' : 'ice';
  actor.pendingExtraTurn = true;
  checkDeath(b);
}

function buildDrawBottles(actor, count, ensureBest = false) {
  const keys = Object.keys(BUILD_BOTTLES);
  let drawn = [];
  if (ensureBest) {
    const match = BEST_MATCHES[Math.floor(Math.random() * BEST_MATCHES.length)];
    drawn.push(match[0], match[1]);
    for (let i = 2; i < count; i++) drawn.push(keys[Math.floor(Math.random() * keys.length)]);
    if (Math.random() < 0.5) { let tmp = drawn[0]; drawn[0] = drawn[1]; drawn[1] = tmp; }
  } else {
    for (let i = 0; i < count; i++) drawn.push(keys[Math.floor(Math.random() * keys.length)]);
  }
  actor.bottles.push(...drawn);
  if (actor.bottles.length > 6) actor.bottles = actor.bottles.slice(-6);
  addBattleLog(actor.side === 'red' ? localBattle : (net.battle || localBattle), `【创骑】抽取能量瓶: ${drawn.map(id => BUILD_BOTTLES[id].name).join(', ')}`, 'passive');
}

      target.hp = Math.max(0, target.hp - 25);
      const before = actor.hp;
      actor.hp = Math.min(actor.maxHp, actor.hp + 20);
      addBattleLog(b, `黑闪！额外25伤害，回复${actor.hp-before}血`, 'passive');
    }
  }

  if(actor.isGatan && skill.gatanClaw && target.hp > 0){
    const chance = actor.gatanDomainTurns > 0 ? 80 : 50;
    if(rnd() < chance){
      target.petrify = (target.petrify || 0) + 1;
      addBattleLog(b, `石化！${target.name} 现有 ${target.petrify} 层`, 'warn');
    }
  }
  if(actor.isGatan && skill.gatanTentacle){
    const heal = 60;
    const before = actor.hp;
    actor.hp = Math.min(actor.maxHp, actor.hp + heal);
    if(actor.hp-before>0) addBattleLog(b, `【${actor.name}】回复 ${actor.hp-before}`, 'heal');
  }
  if(actor.isGatan && skill.gatanUlt && target.hp > 0){
    target.petrify = (target.petrify || 0) + 3;
    addBattleLog(b, `石化光线！${target.name} 附加3层石化`, 'warn');
  }

  if(skill.stun && target.hp>0){
    addStatusSafe(target,'stun','眩晕',skill.stun);
    addBattleLog(b, `【${target.name}】眩晕 ${skill.stun} 回合`, 'warn');
  }
  if(skill.bloodPoison && target.hp>0){
    addStatusSafe(target,'bloodPoison','血毒',skill.bloodPoison);
    addBattleLog(b, `【${target.name}】血毒 ${skill.bloodPoison} 回合`, 'warn');
  }
  if(skill.reduceMaxHp && target.hp>0){
    target.maxHp = Math.max(1, target.maxHp - skill.reduceMaxHp);
    if(target.hp > target.maxHp) target.hp = target.maxHp;
    addBattleLog(b, `【${target.name}】生命上限 -${skill.reduceMaxHp}`, 'warn');
  }
  if(skill.shield){
    const times = Math.max(1, aoeHits);
    const total = skill.shield * times;
    actor.shield += total;
    addBattleLog(b, `【${actor.name}】获得 ${total} 护盾`, 'heal');
  }
  if(skill.broken){
    if(skill.aoe){
      const enemySide = actor.side==='red' ? 'blue' : 'red';
      aliveList(b, enemySide).forEach(t => { if(t.hp>0) addStatusSafe(t,'broken','崩坏',skill.broken); });
      addBattleLog(b, `全体目标被附加崩坏 ${skill.broken} 回合`, 'warn');
    } else if(target.hp>0){
      addStatusSafe(target,'broken','崩坏',skill.broken);
      addBattleLog(b, `【${target.name}】崩坏 ${skill.broken} 回合`, 'warn');
    }
  }

  if(skill.heal){
    const before = actor.hp;
    if(!hasNoHeal(actor)) actor.hp = Math.min(actor.maxHp, actor.hp+skill.heal);
    if(actor.hp-before>0) addBattleLog(b, `【${actor.name}】回复 ${actor.hp-before}`, 'heal');
  }
  if(skill.healPct){
    const before = actor.hp;
    if(!hasNoHeal(actor)) actor.hp = Math.min(actor.maxHp, actor.hp + Math.floor(actor.maxHp*skill.healPct/100));
    if(actor.hp-before>0) addBattleLog(b, `【${actor.name}】回复 ${actor.hp-before}`, 'heal');
  }
  if(skill.cleanse){
    const before = actor.statuses.length;
    actor.statuses = actor.statuses.filter(s => s.id==='focus');
    if(before > actor.statuses.length) addBattleLog(b, `【${actor.name}】驱散负面`, 'heal');
  }
  if(skill.focus){ addStatus(actor,'focus','专注',1); addBattleLog(b, `【${actor.name}】专注`, 'passive'); }
  if(skill.redScale){ addStatus(actor,'redScale','赤鳞',skill.redScale); addBattleLog(b, `【${actor.name}】赤鳞40%减伤`, 'passive'); }

  if(actor.isGinga && skill.id==='ult') actor.gingaHitCount++;
  if(actor.isGinga && !actor.strium){
    if(actor.gingaHitCount >= 2) tryGingaTransform(b, actor);
    else if(actor.gingaHitCount >= 1 && actor.hp < 80 && actor.rage > 20) tryGingaTransform(b, actor);
  }
  if(actor.isGinga && actor.strium && skill.cd > 0 && skill.type !== 'ult'){
    if(rnd() < 40){
      const en = aliveList(b, actor.side==='red'?'blue':'red');
      if(en.length){
        const t = en[Math.floor(Math.random()*en.length)];
        t.hp = Math.max(0, t.hp - 30);
        addBattleLog(b, `【${actor.name}】斯特利姆光线 ${t.name} -30`, 'passive');
      }
    }
  }
  if(actor.isGinga && actor.strium){
    b[actor.side].forEach(c => {
      if(c.hp>0){
        const before = c.hp;
        c.hp = Math.min(c.maxHp, c.hp+20);
        if(c.hp-before>0) addBattleLog(b, `奥特六兄弟：${c.name} 回 ${c.hp-before}`, 'heal');
      }
    });
  }
  if(actor.isYuji) actor.curse = Math.min(100, actor.curse + 10);
  gainRage(actor, skill.gain || 20);
  if(skill.killRage && target.hp<=0){
    gainRage(actor, skill.killRage);
    addBattleLog(b, `击杀返还 ${skill.killRage} 怒气`, 'heal');
  }
  if(skill.ult && actor.isVegito && actor.kiFlame>=3){
    actor.kiFlame = 0;
    addBattleLog(b, `合体气焰清空`, 'passive');
  }
  checkTransform(b, actor);
  checkDeath(b);
}

function dealDamage(b, actor, target, skill, firstHitBonus){
  if(target === b.mahoraga && b.mahoraga && b.mahoraga.hp > 0){
    const raw = skill.dmg + (actor.atkBonus||0);
    damageMahoraga(b, raw);
    return;
  }

  const dodgeBonus = (actor.isGoku && skill.dodgeBonus && actor.dodgedThisTurn) ? skill.dodgeBonus : 0;
  const rageBonus = (actor.isGoku && skill.rageBonus && actor.rage>=50) ? skill.rageBonus : 0;
  const hadShield = target.shield>0;
  const hpBefore = target.hp;

  if(skill.id==='ult2' && hadShield && actor.isVegito){
    const br = Math.min(20, target.shield);
    target.shield -= br;
    if(br>0) addBattleLog(b, `击碎 ${br} 护盾`, '');
  }

  const r = calcDamage(actor, target, skill, {hadShield, summons: b.summons});
  if(!r.trueDamage && r.absorb>0){
    target.shield -= r.absorb;
    addBattleLog(b, `护盾吸收 ${r.absorb}`, '');
  }
  target.hp = Math.max(0, target.hp - r.final);
  addBattleLog(b, `${r.trueDamage?'真实':''}伤害：${target.name} -${r.final}`, 'damage');

  if(target.isYuji) target.curse = Math.min(100, target.curse + 10);
  
  if(actor.isZaki){
    if(skill.zakiBasic && (rnd() < (actor.zakiDestoryTurns > 0 ? 80 : 45))) {
      target.hp = Math.max(0, target.hp - 10);
      gainRage(actor, 10);
      addBattleLog(b, `【${actor.name}】触发重力波动！+10伤害，回10怒`, 'passive');
    }
    if(rnd() < 30) {
      addStatusSafe(target, 'stun', '眩晕', 1);
      addBattleLog(b, `【${actor.name}】被动附加眩晕1回合`, 'passive');
    }
    if(actor.zakiDestoryTurns > 0 && skill.dmg > 0) {
      actor.hp = Math.min(actor.maxHp, actor.hp + Math.floor(r.final * 0.5));
      addBattleLog(b, `【破坏神】吸血回复 ${Math.floor(r.final * 0.5)}`, 'heal');
    }
  }

  if(actor.isYuji && skill.blackFlash && rnd() < 90){
    actor.blackFlashCount++;
    actor.yujiReviveChance = Math.min(100, actor.yujiReviveChance + 10);
    target.hp = Math.max(0, target.hp - 15);
    const before = actor.hp;
    actor.hp = Math.min(actor.maxHp, actor.hp + 20);
    addBattleLog(b, `黑闪！+15伤害，回${actor.hp-before}血，黑闪${actor.blackFlashCount}/8`, 'passive');
    if(actor.blackFlashCount >= 8 && !actor.domainUnlocked){
      actor.domainUnlocked = true;
      addBattleLog(b, `【${actor.name}】解锁领域！`, 'passive');
    }
  }

  const totalTrue = (firstHitBonus||0) + dodgeBonus + rageBonus;
  if(totalTrue>0 && target.hp>0){
    target.hp = Math.max(0, target.hp-totalTrue);
    if(firstHitBonus>0) addBattleLog(b, `首次命中：+${firstHitBonus} 真伤`, 'damage');
    if(dodgeBonus>0) addBattleLog(b, `闪避后追击：+${dodgeBonus} 真伤`, 'damage');
    if(rageBonus>0) addBattleLog(b, `高怒龟派：+${rageBonus} 真伤`, 'damage');
  }
  if(actor.isGinga && skill.extraChance && rnd()<skill.extraChance && target.hp>0){
    target.hp = Math.max(0, target.hp - skill.extraDmg);
    addBattleLog(b, `【${actor.name}】额外 ${skill.extraDmg} 伤害`, 'damage');
  }
  if(skill.lowTrue && hpBefore < target.maxHp*0.5 && target.hp>0){
    target.hp = Math.max(0, target.hp - skill.lowTrue);
    addBattleLog(b, `低血追击：${target.name} -${skill.lowTrue}`, 'damage');
  }
  gainRage(target, 15);
  if(r.trueDamage && actor.isVegito && !isPassiveDisabled(actor)){
    const heal = Math.floor(r.final*0.15);
    const before = actor.hp;
    actor.hp = Math.min(actor.maxHp, actor.hp+heal);
    if(actor.hp-before>0) addBattleLog(b, `气之掌握：回 ${actor.hp-before}`, 'heal');
    if(actor.firstTrueHitThisTurn){
      gainRage(actor, 10);
      actor.firstTrueHitThisTurn = false;
      addBattleLog(b, `气之掌握：首次真伤 +10怒`, 'passive');
    }
    if(actor.kiFlame<3){
      actor.kiFlame++;
      addBattleLog(b, `合体气焰：${actor.kiFlame}/3`, 'passive');
    }
  }
}

function tryGingaTransform(b, u){
  if(!u.isGinga || u.strium || u.hp<=0) return;
  u.strium = true;
  u.maxHp += 50;
  u.hp = Math.min(u.maxHp, u.hp + 100);
  u.skills = GINGA_STRIUM_SKILLS();
  u.pendingExtraTurn = true;
  addBattleLog(b, `✨ 银河变身斯特利姆形态！回100血，上限+50，额外回合`, 'passive');
}

function checkTransform(b, u){
  if(u.hp<=0) return;
  if(isPassiveDisabled(u)) return;
  if(u.isGoku && !u.silverAwakened && u.hp < u.maxHp*0.35){
    u.silverAwakened = true;
    u.statuses = u.statuses.filter(s => s.id==='focus');
    const heal = Math.floor(u.maxHp*0.20);
    u.hp = Math.min(u.maxHp, u.hp+heal);
    u.atkBonus = (u.atkBonus||0)+30;
    u.dmgBonus = (u.dmgBonus||0)+20;
    u.dodgeRate = 50;
    gainRage(u, 30);
    addBattleLog(b, `✨ 银发觉醒！回 ${heal}，攻+30，伤+20%，闪避50%`, 'passive');
  }
  if(!u.isVegito) return;
  if(u.form==='normal' && u.hp<u.maxHp*0.5 && !u.superUsed){
    u.superUsed=true; u.form='super';
    const heal = Math.floor(u.maxHp*0.15);
    u.hp = Math.min(u.maxHp,u.hp+heal);
    u.atkBonus=20; u.dmgBonus=15; u.dmgReduce=0;
    gainRage(u,20);
    u.statuses = u.statuses.filter(s => s.id==='focus');
    addBattleLog(b, `⚡ 超赛！回 ${heal}，攻+20，伤+15%`, 'passive');
  }
  if(u.form==='super' && u.hp<u.maxHp*0.25 && !u.blueUsed){
    u.blueUsed=true; u.form='blue';
    const heal = Math.floor(u.maxHp*0.30);
    u.hp = Math.min(u.maxHp,u.hp+heal);
    u.atkBonus=30; u.dmgBonus=20; u.dmgReduce=10;
    gainRage(u,30);
    u.statuses = u.statuses.filter(s => s.id==='focus');
    addBattleLog(b, `💙 超蓝！回 ${heal}，攻+30，伤+20%，受伤-10%`, 'passive');
  }
}

function checkDeath(b){
  if(b.isBoss){
    const boss = b.boss;
    const playersAlive = aliveList(b,'red').length + aliveList(b,'blue').length;
    if(boss && boss.hp <= 0){ b.over = true; b.winner = 'red'; addBattleLog(b, `🎉 ${boss.name}被击败！合作胜利！`, 'heal'); return; }
    if(playersAlive === 0){ b.over = true; b.winner = 'boss'; addBattleLog(b, `${boss.name}胜利……`, 'warn'); return; }
  }

  [...b.red, ...b.blue].forEach(c => {
    if(c.hp <= 0 && !c.deadFlag){
      if(c.isOOO && c.oooForm === 'eternal'){
        c.oooForm = 'dino';
        c.hp = 100;
        c.maxHp = 100;
        c.statuses = [];
        c.skills = DINOSAUR_SKILLS();
        c.oooSkillCount = 0;
        c.isBerserk = false;
        c.weaponMode = 'axe';
        addBattleLog(b, `【${c.name}】凤凰涅槃，化身OOO 恐龙联组！`, 'revive');
        return;
      }
      if(c.isYuji && !c.yujiReviveUsed && !isPassiveDisabled(c)){
        c.yujiReviveUsed = true;
        if(rnd() < c.yujiReviveChance){
          c.hp = 100; c.deadFlag = false; c.statuses = []; c.shield = 0;
          c.dmgReduce += 10; c.hasReverse = true;
          addBattleLog(b, `【${c.name}】复活！100血，10%减伤，反转术式`, 'revive');
          return;
        } else {
          addBattleLog(b, `【${c.name}】复活失败……`, 'warn');
        }
      }
      c.hp = 0; c.shield = 0; c.statuses = []; c.deadFlag = true;
      addBattleLog(b, `【${c.name}】倒下`, 'warn');
      
      if (c.isZaki) {
        // 扎基的队友死亡不触发
      } else {
        const zaki = [...b.red, ...b.blue].find(x => x.isZaki && x.hp > 0);
        if(zaki) {
          zaki.hp = Math.min(zaki.maxHp, zaki.hp + 10);
          zaki.zakiAtkBonus = Math.min(50, zaki.zakiAtkBonus + 10);
          addBattleLog(b, `【黑暗扎基】被动触发：队友阵亡，回10血，普攻+10（当前+${zaki.zakiAtkBonus}）`, 'passive');
        }
      }

      if(c.isGinga && c.reviveCount < 2){
        c.reviveCount++;
        c.reviveTimer = 2;
        const hp = c.reviveCount===1 ? 140 : 200;
        const rage = c.reviveCount===1 ? 0 : 60;
        c.pendingRevive = {hp, rage};
        addBattleLog(b, `【${c.name}】火花人偶！2回合后以 ${hp} 血复活`, 'revive');
      }
    }
  });
  
  if(b.over) return;
  if(!b.isBoss){
    const redAlive = aliveList(b,'red').length;
    const blueAlive = aliveList(b,'blue').length;
    const redReviving = b.red.some(c => c.isGinga && c.reviveTimer > 0);
    const blueReviving = b.blue.some(c => c.isGinga && c.reviveTimer > 0);
    if(redAlive===0 && !redReviving){ b.over = true; b.winner = 'blue'; addBattleLog(b, '蓝方胜利', 'warn'); }
    else if(blueAlive===0 && !blueReviving){ b.over = true; b.winner = 'red'; addBattleLog(b, '红方胜利', 'heal'); }
  }
}

function tickRevive(b){
  [...b.red, ...b.blue].forEach(c => {
    if(c.isGinga && c.reviveTimer > 0){
      c.reviveTimer--;
      if(c.reviveTimer===0 && c.pendingRevive){
        c.hp = c.pendingRevive.hp;
        c.rage = c.pendingRevive.rage;
        c.shield = 0; c.statuses = [];
        c.deadFlag = false; c.strium = false; c.gingaHitCount = 0;
        c.pendingExtraTurn = false;
        c.skills = CHAR_DB.ginga.skills.map(s => ({...s, currentCd:0}));
        if(c.reviveCount >= 2) c.maxHp = 200;
        addBattleLog(b, `【${c.name}】以 ${c.hp} 血复活！`, 'revive');
        c.pendingRevive = null;
      }
    }
  });
}

function advanceTurn(b){
  if(b.over) return;

  const cur = b.turnIndex >= 0 ? findChar(b, b.order[b.turnIndex]) : null;
  if(cur && cur.pendingExtraTurn && cur.hp > 0){
    cur.pendingExtraTurn = false;
    cur.firstTrueHitThisTurn = true;
    if(cur.isGoku){ cur.dodgedThisTurn = false; cur.firstHitThisTurn = true; }
    addBattleLog(b, `【${cur.name}】额外回合`, 'passive');
    return;
  }

  tickRevive(b);

  let tries = 0;
  while(tries < b.order.length * 3){
    b.turnIndex = (b.turnIndex + 1) % b.order.length;
    const key = b.order[b.turnIndex];
    const c = key === 'boss' ? b.boss : findChar(b, key);
    if(!c || c.hp <= 0){ tries++; continue; }
    if(c.statuses && c.statuses.some(s => (s.id==='stun'||s.id==='converted'||s.id==='bind'||s.id==='frozen'||s.id==='seal'||s.id==='suppress') && s.dur > 0)){
      addBattleLog(b, `【${c.name}】无法行动，跳过`, 'warn');
      endTurnStatuses(c);
      tries++;
      continue;
    }
    c.firstTrueHitThisTurn = true;
    if(c.isGoku){ c.dodgedThisTurn = false; c.firstHitThisTurn = true; }
    if(c.skills) c.skills.forEach(s => { if(s.currentCd > 0) s.currentCd--; });
    if(c.isYuji && c.domainCd > 0) c.domainCd--;
    return;
  }

  const pendingRevive = [...b.red, ...b.blue].some(c => c.isGinga && c.reviveTimer > 0);
  if(pendingRevive){
    if(mode === 'single') renderBattle(b, null, true);
    setTimeout(() => advanceTurn(b), 600);
    return;
  }
  checkDeath(b);
  if(mode === 'single') renderBattle(b, null, true);
}

function startTurn(b, a){
  if(b.over||a.hp<=0) return;
  if(a.isBoss) {
    if (a.id === 'boss_shengzhu') {
      a.statuses = []; // 净控：每回合自动清除自身所有Debuff
      if (a.hp < 170) {
        a.atkBonus = 30; // 破军逆命
        a.skills.forEach(s => { if(s.currentCd >= 2) s.currentCd -= 2; else s.currentCd = 0; });
      } else {
        a.atkBonus = 0;
      }
    }
    return;
  }
  
  if(a.burnStacks > 0){
    const d = a.burnStacks * 15;
    a.hp = Math.max(0, a.hp - d);
    addBattleLog(b, `永久灼烧：${a.name} -${d}`, 'damage');
  }
  if(a.isGatan && a.gatanFogTurns > 0){
    a.shield += a.gatanFogShield;
    addBattleLog(b, `【${a.name}】黑雾：+${a.gatanFogShield} 护盾`, 'heal');
    a.gatanFogTurns--;
    if(a.gatanFogTurns <= 0) addBattleLog(b, `【${a.name}】黑雾消散`, 'info');
  }
  if(a.isGatan && a.gatanDomainTurns > 0){
    a.gatanDomainTurns--;
    if(a.gatanDomainTurns === 0){ a.gatanReduceBonus = 0; addBattleLog(b, `【${a.name}】邪神降临结束`, 'warn'); }
  }
  if(a.isYuji){
    if(a.hasReverse && !isPassiveDisabled(a)) a.hp = Math.min(a.maxHp, a.hp + 15);
    if(!isPassiveDisabled(a)) a.hp = Math.min(a.maxHp, a.hp + 20);
    if(a.domainTurns > 0){
      if(rnd() < 20){
        const en = aliveList(b, a.side==='red'?'blue':'red');
        if(en.length){
          const t = en[Math.floor(Math.random()*en.length)];
          addStatusSafe(t, 'converted', '策反', 1);
          addBattleLog(b, `领域策反！【${t.name}】1回合`, 'passive');
        }
      }
      a.domainTurns--;
      if(a.domainTurns === 0){ a.ritualLock = 2; addBattleLog(b, `【${a.name}】领域结束，熔断2回合`, 'warn'); }
    }
  }
  if(a.isFushiguro){
    const before = a.hp;
    a.hp = Math.min(a.maxHp, a.hp + 15);
    if(a.hp-before>0) addBattleLog(b, `反转术式：回 ${a.hp-before}`, 'heal');
    else if(a.hp >= a.maxHp){ a.shield += 15; addBattleLog(b, `反转术式：+15盾`, 'heal'); }
    if(a.fushiDomainTurns > 0){
      a.fushiDomainTurns--;
      if(a.fushiDomainTurns === 0) addBattleLog(b, `【${a.name}】领域结束`, 'warn');
    }
    if(a.shadowHide > 0){
      if(b.summons){
        b.summons.forEach(s => {
          if(s.hp > 0 && s.tamed && s.ownerKey === a.key){ s.dmg = (s.dmg||0) + 8; }
        });
      }
      a.shadowHide = 0;
      addBattleLog(b, `影子隐匿结束，式神攻击+8`, 'passive');
    }
    if(b.summons && b.summons.some(s=>s.hp>0 && s.ownerKey===a.key && s.shikiId==='maxElephant')){
      a.rage = Math.max(0, a.rage - 10);
      addBattleLog(b, `满象在场：${a.name} 消耗10怒`, 'warn');
    }
  }
  if(a.isBuild) {
    a.hp = Math.min(a.maxHp, a.hp + 5);
    addBattleLog(b, `【${a.name}】被动：回合结束回复5血量`, 'heal');
  }
  if(a.isZaki && a.zakiDomainTurns > 0) {
    const enemySide = a.side === 'red' ? 'blue' : 'red';
    let hits = 0;
    aliveList(b, enemySide).forEach(t => {
      t.hp = Math.max(0, t.hp - 10); hits++;
    });
    if(b.isBoss && b.boss && b.boss.hp > 0) { b.boss.hp = Math.max(0, b.boss.hp - 10); hits++; }
    addBattleLog(b, `【${a.name}】黑暗领域G：对全体造成10伤害`, 'passive');
    
    b[a.side].forEach(c => {
      if(c.hp > 0) gainRage(c, 5);
    });
    addBattleLog(b, `【${a.name}】黑暗领域G：我方全体回5怒`, 'heal');
  }
  if(a.isOOO && a.oooForm === 'eternal') {
    a.hp = Math.min(a.maxHp, a.hp + 10);
    addBattleLog(b, `【${a.name}】凤凰永生：回10血`, 'heal');
  }
  a.statuses.forEach(s => {
    if(s.id==='bloodPoison' && s.dur>0){ a.hp = Math.max(0, a.hp - 20); addBattleLog(b, `血毒/炼狱灼烧：${a.name} -20`, 'damage'); }
    if(s.id==='tear' && s.dur>0){ const d=a.dotDmg||12; a.hp = Math.max(0, a.hp - d); addBattleLog(b, `持续伤害：${a.name} -${d}`, 'damage'); }
  });
  checkDeath(b);
}

function checkBossPhase(b){
  const boss = b.boss;
  if(!boss || boss.hp <= 0) return;
  if (boss.id === 'boss_shengzhu') return;

  const hpPct = boss.hp / boss.maxHp;
  if(boss.phase === 1 && hpPct <= 0.666){
    boss.phase = 2;
    boss.atkBonus = 15;
    if(!boss.skills.some(s=>s.id==='s4')) boss.skills.push(sk('s4','传说爆发',40,'normal',3,0,0,{aoe:true}));
    addBattleLog(b, `🔥 布罗利第二阶段！攻击力提升`, 'revive');
  } else if(boss.phase === 2 && hpPct <= 0.333){
    boss.phase = 3;
    boss.atkBonus = 30;
    boss.bossActions = 2;
    boss.dmgReduce = 20;
    addBattleLog(b, `🔥🔥 布罗利第三阶段！双动+减伤`, 'revive');
  }
}

function bossAct(b){
  const boss = b.boss;
  if(!boss || boss.hp <= 0 || b.over) return;
  
  const players = [...aliveList(b,'red'), ...aliveList(b,'blue')];
  if(!players.length) return;

  for(let act=0; act<boss.bossActions; act++){
    if(b.over || boss.hp <= 0) break;
    
    const target = players.reduce((x,y)=>x.hp<=y.hp?x:y);
    let chosen = null;
    
    if (boss.id === 'boss_shengzhu') {
      const avail = boss.skills.filter(s => s.currentCd === 0 && (!s.ult || boss.rage >= s.cost));
      if (avail.length > 0) {
        chosen = avail[Math.floor(Math.random()*avail.length)];
      } else {
        chosen = boss.skills[0];
      }
    } else {
      if(boss.phase >= 2){
        const ult = boss.skills.find(s => s.id==='s3' && s.currentCd===0);
        if(ult) chosen = ult;
      }
      if(!chosen && boss.phase >= 2){
        const aoe = boss.skills.find(s => s.id==='s4' && s.currentCd===0);
        if(aoe) chosen = aoe;
      }
      if(!chosen){
        const dmg = boss.skills.filter(s => !s.aoe && s.id!=='s3' && s.currentCd===0);
        if(dmg.length) chosen = dmg[Math.floor(Math.random()*dmg.length)];
      }
      if(!chosen) chosen = boss.skills[0];
    }
    
    if(chosen.cd>0) chosen.currentCd = chosen.cd;

    addBattleLog(b, `👹 【${boss.name}】施放 ${chosen.name}`, 'info');
    
    if(chosen.aoe){
      players.forEach(t => {
        if(t.hp<=0) return;
        const dmg = chosen.dmg + boss.atkBonus;
        t.hp = Math.max(0, t.hp - dmg);
        addBattleLog(b, `${chosen.name}：${t.name} -${dmg}`, 'damage');
        gainRage(t, 15);
      });
    } else {
      const dmg = chosen.dmg + boss.atkBonus;
      target.hp = Math.max(0, target.hp - dmg);
      addBattleLog(b, `${chosen.name}：${target.name} -${dmg}`, 'damage');
      gainRage(target, 15);
    }

    if (boss.id === 'boss_shengzhu') {
      if (chosen.szBasic) {
        target.marks = Math.min(4, (target.marks||0) + 1);
      } else if (chosen.szS1) {
        addStatusSafe(target, 'panic', '禁锢', 1);
        addStatusSafe(target, 'bloodPoison', '炼狱灼烧', 2);
        target.marks = 4;
      } else if (chosen.szS2) {
        addStatusSafe(target, 'noHeal', '禁疗', 99);
        target.skills.forEach(s => { s.currentCd += 2; });
        if (target.isYuji) target.yujiReviveUsed = true;
        if (target.isGinga) target.reviveCount = 2;
      } else if (chosen.szUlt) {
        addStatusSafe(target, 'panic', '禁锢', 1);
        target.marks = 4;
        boss.critTurns = 2;
      }
      checkDeath(b);
      continue;
    }
    
    if(boss.phase === 3) boss.hp = Math.min(boss.maxHp, boss.hp + 20);
    
    checkBossPhase(b);
    checkDeath(b);
  }
  
  if(!b.over){
    endTurnStatuses(boss);
    boss.skills.forEach(s => { if(s.currentCd>0) s.currentCd--; });
  }
}

function renderBattle(b, mySideParam, isSingle){
  if(!b) return;
  if(b.isBoss) $('bossTitle').textContent = `Boss · ${b.boss.name}`;
  renderSide('red', $('redCards'), $('redSummons'), b, mySideParam, isSingle);
  renderSide('blue', $('blueCards'), $('blueSummons'), b, mySideParam, isSingle);
  if(b.isBoss && b.boss){
    $('bossPanel').style.display = 'block';
    renderBoss($('bossCards'), b, mySideParam, isSingle);
  } else {
    $('bossPanel').style.display = 'none';
  }
  renderBtns(b, mySideParam, isSingle);
  renderLogs(b);
  renderResult(b, mySideParam, isSingle);
}

function renderBoss(box, b, mySideParam, isSingle){
  if(!box) return;
  box.innerHTML = '';
  const c = b.boss;
  if(!c) return;
  const el = document.createElement('div');
  el.className = 'card boss' + (selectedTargetKey==='boss'?' selected':'');
  const hpPct = Math.max(0, c.hp/c.maxHp*100);
  let tag = '';
  if(c.id==='boss_shengzhu' && c.hp < 170) tag += '<span class="tag sz">狂暴</span>';
  if(c.id==='boss_shengzhu' && c.critTurns > 0) tag += `<span class="tag sz">暴击${c.critTurns}</span>`;
  el.innerHTML = `
    <div class="card-top"><span class="name">${c.name}</span><span class="type">阶段${c.phase}</span></div>
    <div class="stats"><span>HP ${Math.max(0,c.hp)}/${c.maxHp}</span><span>行动${c.bossActions}次</span></div>
    <div class="bar hp"><div class="bar-inner" style="width:${hpPct}%"></div></div>
    <div class="stats"><span>攻击+${c.atkBonus+35}</span><span>减伤${c.dmgReduce}</span></div>
    <div class="status-row">
      ${c.petrify>0 ? `<span class="tag blood">石化${c.petrify}</span>` : ''}
      ${c.burnStacks>0 ? `<span class="tag blood">灼烧${c.burnStacks}</span>` : ''}
      ${tag}
    </div>
  `;
  if(c.hp > 0 && canActNow(b, mySideParam, isSingle)){
    el.onclick = () => { selectedTargetKey = 'boss'; renderBattle(b, mySideParam, isSingle); };
  }
  box.appendChild(el);
}

  b[side].forEach(c => {

      (c.hp<=0?' dead':'') + (isActive?' active':'') + (isTarget?' selected':'');

      (isSingle && side==='blue' && !b.isBoss) ||

    );

    }
    const hpPct = Math.max(0, c.hp/c.maxHp*100);
    const ragePct = Math.min(100, c.rage);
    const kiPct = c.isVegito ? (c.kiFlame/3*100) : 0;
    let formTag = '';
    if(c.form==='super') formTag += '<span class="tag form">超赛</span>';
    if(c.form==='blue') formTag += '<span class="tag form">超蓝</span>';
    if(c.silverAwakened) formTag += '<span class="tag form">银发</span>';
    if(c.strium) formTag += '<span class="tag form">斯特利姆</span>';
    if(c.isYuji) formTag += `<span class="tag form">黑闪${c.blackFlashCount}/8</span>`;
    if(c.domainTurns>0) formTag += `<span class="tag form">领域${c.domainTurns}</span>`;
    if(c.ritualLock>0) formTag += `<span class="tag form">熔断${c.ritualLock}</span>`;
    if(c.isGatan){
      if(c.gatanDomainTurns > 0) formTag += `<span class="tag gatan">邪神${c.gatanDomainTurns}</span>`;
      if(c.gatanFogTurns > 0) formTag += `<span class="tag gatan">黑雾${c.gatanFogTurns}</span>`;
    }
    if(c.isFushiguro){
      if(c.fushiDomainTurns > 0) formTag += `<span class="tag shiki">领域${c.fushiDomainTurns}</span>`;
      if(c.shadowHide > 0) formTag += `<span class="tag shiki">隐匿</span>`;
    }
    if(c.isNoa){
      if(c.noaLight > 0) formTag += `<span class="tag noa">光芒${c.noaLight}/2</span>`;
      if(c.nextBasic === 'planet') formTag += `<span class="tag noa">行星碰撞</span>`;
      if(c.nextBasic === 'ice') formTag += `<span class="tag noa">冰封待发</span>`;
    }
    if(c.isBuild) {
      formTag += `<span class="tag build">能量瓶: ${c.bottles.map(id=>BUILD_BOTTLES[id].name).join(' ')}</span>`;
      if(c.bestMatchCount >= 3) formTag += `<span class="tag build">方程式就绪</span>`;
    }
    if(c.isYuta) {
      if(c.riikaTurns > 0) formTag += `<span class="tag riika">里香${c.riikaTurns}</span>`;
      if(c.yutaDomainTurns > 0) formTag += `<span class="tag riika">真赝相爱${c.yutaDomainTurns}</span>`;
    }
    if(c.isZaki) {
      if(c.zakiDestoryTurns > 0) formTag += `<span class="tag zaki">破坏神${c.zakiDestoryTurns}</span>`;
      if(c.zakiDomainTurns > 0) formTag += `<span class="tag zaki">领域${c.zakiDomainTurns}</span>`;
      if(c.zakiAtkBonus > 0) formTag += `<span class="tag zaki">被动+${c.zakiAtkBonus}</span>`;
    }
    if(c.isOOO) {
      if(c.oooForm === 'eternal') formTag += `<span class="tag ooo">永恒鸟</span>`;
      else formTag += `<span class="tag ooo">恐龙联组</span>`;
      if(c.isBerserk) formTag += `<span class="tag berserk">暴走中!</span>`;
      if(c.weaponMode) formTag += `<span class="tag ooo">${c.weaponMode === 'axe' ? '斧' : '炮'}模式</span>`;
    }
    if (c.marks > 0) formTag += `<span class="tag sz">巅峰印记${c.marks}层</span>`;

    const statusTags = c.statuses.map(s => {
      const cls = s.id==='stun'||s.id==='frozen'?'stun':s.id==='panic'?'panic':s.id==='focus'?'focus':s.id==='broken'?'broken':s.id==='bloodPoison'?'blood':s.id==='redScale'?'redscale':s.id==='converted'?'converted':s.id==='bind'?'bind':s.id==='suppress'?'bind':s.id==='seal'||s.id==='passive_seal'?'bind':s.id==='noHeal'?'noheal':'';
      return `<span class="tag ${cls}">${s.name}${s.dur}</span>`;
    }).join('');
    const burnTag = c.burnStacks > 0 ? `<span class="tag blood">灼烧${c.burnStacks}层</span>` : '';
    const petrifyTag = c.petrify > 0 ? `<span class="tag petrify">石化${c.petrify}</span>` : '';
    const reviveTag = c.reviveTimer>0 ? `<span class="tag revive">复活${c.reviveTimer}</span>` : '';
    const passiveTag = c.passiveDisabled>0 ? `<span class="tag erosion">被动失效${c.passiveDisabled}</span>` : '';

      <div class="stats"><span>HP ${Math.max(0,c.hp)}/${c.maxHp}</span><span>怒 ${Math.floor(c.rage)}/100</span></div>
      <div class="bar hp"><div class="bar-inner" style="width:${hpPct}%"></div></div>
      <div class="bar rage"><div class="bar-inner" style="width:${ragePct}%"></div></div>
      ${c.isVegito ? `<div class="bar ki"><div class="bar-inner" style="width:${kiPct}%"></div></div>` : ''}
      <div class="stats"><span>盾 ${c.shield}</span><span>${formTag}${c.isVegito?`气焰${c.kiFlame}/3`:''}${c.isGoku?`闪避${c.dodgeRate}%`:''}${c.isGinga?`至高${c.gingaHitCount}/2`:''}${c.isYuji?`咒${c.curse}`:''}</span></div>
      <div class="status-row">${burnTag}${petrifyTag}${reviveTag}${passiveTag}${statusTags}</div>`;

  if(summonBox){

      b.summons.filter(s => s.side===side).forEach(s => {
        const el = document.createElement('div');
        el.className = 'card-summon' + (s.hp<=0?' dead':'');
        if(s.hp > 0 && side !== mySideParam && canActNow(b, mySideParam, isSingle)){
          el.onclick = () => { selectedTargetKey = s.sid; renderBattle(b, mySideParam, isSingle); };
        }
        const hpPct = Math.max(0, s.hp/s.maxHp*100);
        el.innerHTML = `
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:bold">

      });
    }
    if(b.mahoraga && b.mahoraga.hp > 0 && ((side==='red' && b.mahoraga.ownerSide==='red') || (side==='blue' && b.mahoraga.ownerSide==='blue'))){
      const m = b.mahoraga;
      const el = document.createElement('div');
      el.className = 'card-summon' + (!m.tamed?' neutral':'');
      const hpPct = Math.max(0, m.hp/m.maxHp*100);
      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:bold;color:#ffb8b8">
          <span>${m.name}${!m.tamed?' [待调服·中立]':' [已调服]'}</span>
          <span>HP ${Math.max(0,m.hp)}/${m.maxHp}</span>
        </div>
        <div class="bar hp"><div class="bar-inner" style="width:${hpPct}%"></div></div>
        <div style="font-size:10px;color:#9aa4c8;margin-top:2px">适应 ${m.adapt}/10 · 减伤 ${m.adapt*10}</div>
      `;
      summonBox.appendChild(el);
    }
  }
}

function canActNow(b, mySideParam, isSingle){
  if(!b || b.over) return false;
  if(b.turnIndex < 0 || b.turnIndex >= b.order.length) return false;
  const actor = findChar(b, b.order[b.turnIndex]);
  if(isSingle) return actor && actor.side==='red' && actor.hp>0 && !actor.isBoss;
  return actor && actor.side===mySideParam && actor.hp>0 && !actor.isBoss;
}

function renderBtns(b, mySideParam, isSingle){
  const box = $('skillButtons');
  box.innerHTML = '';
  const title = $('actionTitle');
  if(b.over){ box.innerHTML='<span class="hint">战斗结束</span>'; title.textContent='战斗结束'; return; }
  
  if(b.turnIndex < 0 || b.turnIndex >= b.order.length) return;
  const actor = findChar(b, b.order[b.turnIndex]);
  
  if(!actor || actor.hp<=0){
    box.innerHTML='<span class="hint">等待...</span>';
    if(b.isBoss){
      if(mySideParam === 'red' && !aliveList(b,'red').length) box.innerHTML = '<span class="hint">你已阵亡，观战中…</span>';
      if(mySideParam === 'blue' && !aliveList(b,'blue').length) box.innerHTML = '<span class="hint">你已阵亡，观战中…</span>';
    }
    return;
  }
  
  if(actor.isBoss){
    title.textContent = `Boss ${actor.name} 行动中...`;
    box.innerHTML = '<span class="hint">Boss正在攻击...</span>';
    return;
  }
  
  const isMyTurn = isSingle ? actor.side==='red' : actor.side===mySideParam;
  if(!isMyTurn){
    title.textContent = `${actor.name} 行动中...`;
    box.innerHTML = '<span class="hint">等待对方...</span>';
    return;
  }
  
  title.textContent = `你的回合：${actor.name}`;
  if(actor.statuses.some(s => (s.id==='stun'||s.id==='converted'||s.id==='bind'||s.id==='frozen'||s.id==='seal'||s.id==='suppress') && s.dur>0)){
    box.innerHTML = '<span class="hint">无法行动...</span>';
    return;
  }
  const panicOnly = actor.statuses.some(s => s.id==='panic' && s.dur>0);
  const ritualOnly = actor.isYuji && actor.ritualLock>0;
  const isBerserk = actor.isOOO && actor.isBerserk;
  
  if (actor.isBuild && actor.bottles.length >= 3) {
      const b1 = actor.bottles[0], b2 = actor.bottles[1];
      const sortMatch = [b1, b2].sort().join('_');
      const isBest = BEST_MATCHES.some(m => [m[0], m[1]].sort().join('_') === sortMatch);
      const cd = actor.bestMatchCd[sortMatch] || 0;
      
      const btn = document.createElement('button');
      btn.style.background = isBest ? '#4a2a5c' : '#2e3966';
      btn.style.borderColor = isBest ? '#9b59b6' : '#5d6ba8';
      btn.innerHTML = `强化普攻<br><small>${BUILD_BOTTLES[b1].name}+${BUILD_BOTTLES[b2].name}${isBest?'·最佳':''}${cd>0?` CD${cd}`:''}</small>`;
      btn.disabled = cd > 0 || isBerserk;
      btn.onclick = () => {
          const target = pickTarget(b, actor.side);
          if(!target) return;
          
          actor.bottles.splice(0, 2);
          actor.hp = Math.min(actor.maxHp, actor.hp + 10);
          
          if (isBest) {
              actor.bestMatchCount++;
              actor.bestMatchCd[sortMatch] = 1;
              actor.pendingExtraTurn = true;
              addBattleLog(b, `【创骑】完美组合！获得额外回合，冷却减少`, 'revive');
          } else {
              actor.bestMatchCd[sortMatch] = 2;
              addBattleLog(b, `【创骑】组合普攻`, 'info');
          }
          
          const applyBottle = (id) => {
              if (id === 'comic') {
                  actor.hp = Math.min(actor.maxHp, actor.hp + 50);
                  b[actor.side].forEach(a => { if (a.hp > 0 && a.key !== actor.key) a.hp = Math.min(a.maxHp, a.hp + 20); });
                  addBattleLog(b, `漫画：回血`, 'heal');
              } else if (id === 'ninja') {
                  target.hp = Math.max(0, target.hp - 20);
                  addStatusSafe(target, 'stun', '眩晕', 1);
                  addBattleLog(b, `忍者：${target.name} -20，眩晕`, 'damage');
              } else if (id === 'gorilla') {
                  target.hp = Math.max(0, target.hp - 50);
                  gainRage(actor, 5);
                  addBattleLog(b, `猩猩：${target.name} -50`, 'damage');
              } else if (id === 'diamond') {
                  actor.shield += 40;
                  addStatus(actor, 'diamond_immunity', '霸体', 1);
                  addBattleLog(b, `钻石：霸体+40盾`, 'heal');
              } else if (id === 'hawk') {
                  actor.pendingExtraTurn = true;
                  addBattleLog(b, `飞鹰：额外回合`, 'passive');
              } else if (id === 'gatling') {
                  for(let i=0; i<3; i++) {
                      let d = 15;
                      let red = target.dmgReduce || 0;
                      if (target.isGatan) red += 10;
                      let actual = Math.max(0, d - red);
                      target.hp = Math.max(0, target.hp - actual);
                  }
                  addBattleLog(b, `加特林：3段伤害`, 'damage');
              }
          };
          applyBottle(b1);
          applyBottle(b2);
          
          endTurnStatuses(actor);
          afterYutaAction(b, actor);
          advanceTurn(b);
          const n = findChar(b, b.order[b.turnIndex]);
          if (n && n.hp > 0) startTurn(b, n);
          renderBattle(b, null, true);
          afterSingleAdvance(b);
      };
      box.appendChild(btn);
  }

  actor.skills.forEach(s => {
    const btn = document.createElement('button');
    if(s.ult) btn.className = 'ult';
    let dis = false, why = '';
    if(s.currentCd > 0){ dis=true; why=`CD${s.currentCd}`; }
    if(s.cost > 0 && actor.rage < s.cost){ dis=true; why=`怒${s.cost}`; }
    if(s.curseCost && actor.curse < s.curseCost){ dis=true; why=`咒${s.curseCost}`; }
    if(s.yujiDomain && !actor.domainUnlocked){ dis=true; why='未解锁'; }
    if(s.yujiDomain && actor.domainCd>0){ dis=true; why=`CD${actor.domainCd}`; }
    if(s.summonShiki && actor.shadowHide > 0){ dis=true; why='隐匿中'; }
    if(s.riikaOnly && actor.riikaTurns <= 0){ dis=true; why='需里香显现'; }
    if(s.zakiLightning && actor.zakiDestoryTurns <= 0){ dis=true; why='需破坏神姿态'; }
    if(isBerserk && s.id !== 'basic'){ dis=true; why='暴走只能普攻'; }
    if(s.summonShiki && b.summons){
      const limit = getSummonLimit(actor);
      const aliveTamed = b.summons.filter(s2 => s2.ownerKey === actor.key && s2.hp > 0 && s2.tamed);
      if(aliveTamed.length >= limit){ dis=true; why=`式神满${limit}`; }
    }
    if(s.dmg===0 && !s.heal && !s.shield && !s.focus && !s.yujiDomain && !s.redScale && !s.gatanDomain && !s.gatanFog && !s.summonShiki && !s.shadowBind && !s.shadowHide && !s.fushiDomain && !s.mahoraga && !s.noaGravity && !s.noaBlizzard && !s.noaHellfire && !s.nebula && !s.buildUlt1 && !s.buildUlt2 && !s.copy && !s.yutaRiika && !s.yutaUlt2 && !s.zakiDestory && !s.zakiDomain && !s.oooBind && !s.oooWeapon){ dis=true; why='无效果'; }
    if(panicOnly && s.id!=='basic'){ dis=true; why='惊慌只能普攻'; }
    if(ritualOnly && s.id!=='basic'){ dis=true; why='熔断只能普攻'; }
    
    if (s.buildUlt2) {
        if (actor.bestMatchCount < 3) dis = true;
        why = actor.bestMatchCount < 3 ? '次数不足' : '';
    }
    
    btn.disabled = dis;

    if(s.noaBasic && actor.isNoa){
      let label = '诺亚重拳';
      let sub = '25·回30';
      if(actor.nextBasic === 'planet'){ label = '行星碰撞'; sub = '全体35·驱散'; }
      else if(actor.nextBasic === 'ice'){ label = '诺亚冰封'; sub = '20·冰封1回合'; }
      btn.innerHTML = `${label}<span style="display:block;font-size:9px;color:#9aa4c8">${sub}</span>`;
      btn.disabled = dis;
      btn.onclick = () => onSkillClick(b, actor, s, isSingle);
      box.appendChild(btn);
      return;
    }

    const meta = [];
    if(s.dmg>0) meta.push(`${s.dmg}${s.segments?'×'+s.segments:''}${s.dtype==='true'?'真伤':'伤害'}${s.aoe?'·群':''}${s.ignoreShield?'·破盾':''}`);
    if(s.shield) meta.push(`盾${s.shield}`);
    if(s.heal) meta.push(`回${s.heal}`);
    if(s.costHp) meta.push(`血${s.costHp}`);
    if(s.curseCost) meta.push(`咒${s.curseCost}`);
    if(s.stun) meta.push('眩晕');
    if(s.broken) meta.push(`崩坏${s.broken}`);
    if(s.petrify) meta.push(`石化${s.petrify}`);
    if(s.cost) meta.push(`耗${s.cost}`);
    if(s.currentCd) meta.push(`CD${s.currentCd}`);
    if(s.buildUlt2) meta.push(`已有${actor.bestMatchCount}/3`);
    
    btn.innerHTML = `${s.name}<span style="display:block;font-size:9px;color:#9aa4c8">${meta.join('·')}${why?' · '+why:''}</span>`;
    btn.onclick = () => onSkillClick(b, actor, s, isSingle);
    box.appendChild(btn);
  });
}

function renderLogs(b){
  const el = $('log');
  el.innerHTML = '';
  (b.logs || []).forEach(item => {
    const d = document.createElement('div');
    d.className = item.cls || '';
    d.textContent = item.msg;
    el.appendChild(d);
  });
  el.scrollTop = el.scrollHeight;
}

function renderResult(b, mySideParam, isSingle){
  const el = $('result');
  if(b.over){
    let win = false;
    if(b.isBoss) win = b.winner === 'red';
    else if(isSingle) win = b.winner === 'red';
    else win = b.winner === mySideParam;
    el.className = 'result ' + (win?'win':'lose');
    el.textContent = win ? '胜利！' : '失败……';
  } else {
    el.className = 'result';
    el.textContent = '';
  }
}

function onSkillClick(b, actor, skill, isSingle){
  if(isSingle) singlePerformAction(b, actor, skill);
  else onlinePerformAction(b, actor, skill);
}

function pickTarget(b, actorSide){
  const enemySide = actorSide==='red' ? 'blue' : 'red';
  const en = aliveList(b, enemySide);
  if(!en.length) return b.isBoss ? b.boss : null;
  let t = selectedTargetKey ? findChar(b, selectedTargetKey) : null;
  if(!t || t.hp<=0 || t.side===actorSide) t = b.isBoss ? b.boss : en[0];
  return t;
}

function noaEnhancedBasic(b, actor, target, isSingle){
  const isPlanet = actor.nextBasic === 'planet';
  actor.nextBasic = null;
  if(isPlanet){
    const enemySide = actor.side==='red' ? 'blue' : 'red';
    aliveList(b, enemySide).forEach(t => {
      if(t.hp<=0) return;
      t.hp = Math.max(0, t.hp - 35);
      t.statuses = t.statuses.filter(s => ['focus','frozen','suppress','redScale'].includes(s.id));
      t.shield = 0;
      addBattleLog(b, `行星碰撞：${t.name} -35，驱散增益`, 'damage');
    });
    if(b.isBoss && b.boss && b.boss.hp > 0){
      b.boss.hp = Math.max(0, b.boss.hp - 35);
      addBattleLog(b, `行星碰撞：布罗利 -35`, 'damage');
    }
  } else {
    target.hp = Math.max(0, target.hp - 20);
    addStatusSafe(target,'frozen','冰封',1);
    addBattleLog(b, `诺亚冰封：${target.name} -20，冰封1回合`, 'warn');
  }
  const before = actor.hp;
  actor.hp = Math.min(actor.maxHp, actor.hp + 30);
  if(actor.hp-before>0) addBattleLog(b, `诺亚重拳：回 ${actor.hp-before}`, 'heal');
  actor.noaLight++;
  addBattleLog(b, `光芒：${actor.noaLight}/2`, 'passive');
  if(actor.noaLight >= 2){
    actor.noaLight = 0;
    triggerNoaLight(b, actor);
  }
  gainRage(actor, 20);
  selectedTargetKey = null;
  checkDeath(b);
  if(!b.over){
    if(actor.isFushiguro) resolveShikiTurn(b, actor);
    petrifyTick(b, actor);
    endTurnStatuses(actor);
    afterYutaAction(b, actor);
    advanceTurn(b);
    const nc = findChar(b, b.order[b.turnIndex]);
    if(nc && nc.hp>0) startTurn(b, nc);
    if(b.mahoraga && b.mahoraga.hp > 0) mahoragaTurn(b);
  }
  if(isSingle) renderBattle(b, null, true);
  else renderBattle(b, mySide, false);
  if(isSingle) afterSingleAdvance(b);
}

let summonCtx = null;

  list.innerHTML = '';
  Object.values(SHIKI_DB).forEach(sd => {

    btn.textContent = `${sd.name} · HP${sd.hp} · 伤害${sd.dmg}${sd.heal?` · 治疗${sd.heal}`:''}`;
    btn.onclick = () => {
      closeSummonModal();
      summonShiki(b, actor, sd.id);
      gainRage(actor, 20);
      renderBattle(b, actor.isPlayer?(actor.side==='red'?null:'blue'):null, mode==='single');
      if(mode==='single' && !b.over){
        endTurnStatuses(actor);
        afterYutaAction(b, actor);
        advanceTurn(b);
        const cur = findChar(b, b.order[b.turnIndex]);
        if(cur && cur.hp>0) startTurn(b, cur);
        renderBattle(b, null, true);
        afterSingleAdvance(b);
      }
    };
    list.appendChild(btn);
  });
  $('summonModal').classList.add('show');
}

function closeSummonModal(){
  $('summonModal').classList.remove('show');
  summonCtx = null;
}
window.closeSummonModal = closeSummonModal;

let copyCtx = null;
function openCopyModal(b, actor){
  copyCtx = {b, actor};
  const list = $('copyList');
  list.innerHTML = '';
  const allTargets = [...b.red, ...b.blue, ...(b.boss ? [b.boss] : [])].filter(c => c.hp > 0);
  
  allTargets.forEach(c => {
    c.skills.forEach(s => {
      if (s.copy) return;
      if (s.ult && !(actor.yutaDomainTurns > 0 && !actor.copiedUltUsed)) return;
      
      const btn = document.createElement('button');
      btn.className = 'shiki-btn';
      btn.innerHTML = `【${c.name}】${s.name} ${s.dmg>0 ? '伤'+s.dmg : ''}${s.heal?'回'+s.heal:''}`;
      btn.onclick = () => {
        closeCopyModal();
        addBattleLog(b, `【${actor.name}】复制了【${c.name}】的【${s.name}】`, 'passive');
        
        let copiedSkill = { ...s, currentCd: 0 };
        if (copiedSkill.ult && actor.yutaDomainTurns > 0) {
            copiedSkill.cost = 0;
            actor.copiedUltUsed = true;
        }
        
        let target = null;
        if (s.aoe || s.heal) target = actor;
        else {
            target = pickTarget(b, actor.side);
            if (copiedSkill.dmg > 0 && target.hp <= 0) target = actor;
        }
        
        executeSkill(b, actor, copiedSkill, target);
        
        if(!b.over){
            afterYutaAction(b, actor);
            endTurnStatuses(actor);
            advanceTurn(b);
            const n = findChar(b, b.order[b.turnIndex]);
            if(n && n.hp>0) startTurn(b, n);
        }
        renderBattle(b, null, true);
        afterSingleAdvance(b);
      };
      list.appendChild(btn);
    });
  });
  $('copyModal').classList.add('show');
}

function closeCopyModal(){
  $('copyModal').classList.remove('show');
  copyCtx = null;
}
window.closeCopyModal = closeCopyModal;

function afterYutaAction(b, actor) {
    if (actor.isYuta && actor.hp > 0) {
        aliveList(b, actor.side).forEach(a => {
            a.hp = Math.min(a.maxHp, a.hp + 10);
        });
        addBattleLog(b, `【被动·反转术式】我方全体回复10血量`, 'heal');
    }
}

function singlePerformAction(b, actor, skill){
  if(!b || b.over) return;
  if(actor.side !== 'red') return;
  if(skill.currentCd > 0) return;
  if(skill.cost > 0 && actor.rage < skill.cost) return;
  if(skill.curseCost && actor.curse < skill.curseCost) return;
  if(skill.yujiDomain && (!actor.domainUnlocked || actor.domainCd>0 || actor.rage<100)) return;
  if(actor.isYuji && actor.ritualLock>0 && skill.id!=='basic') return;
  if(skill.summonShiki && actor.shadowHide>0) return;
  if(skill.buildUlt2 && actor.bestMatchCount < 3) return;
  if(skill.riikaOnly && actor.riikaTurns <= 0) return;
  if(skill.zakiLightning && actor.zakiDestoryTurns <= 0) return;
  if(actor.isOOO && actor.isBerserk && skill.id !== 'basic') return;

  if(skill.summonShiki){
    openSummonModal(b, actor);
    return;
  }
  if(skill.copy){
    openCopyModal(b, actor);
    return;
  }

  let target = null;
  if(selectedTargetKey && selectedTargetKey.startsWith('shiki_')){
    target = b.summons.find(s => s.sid === selectedTargetKey);
  } else if(selectedTargetKey === 'boss' && b.boss){
    target = b.boss;
  } else {
    target = pickTarget(b, actor.side);
  }
  if(!target || target.hp<=0) target = pickTarget(b, actor.side);
  if(!target) return;

  if(actor.isNoa && actor.nextBasic && skill.noaBasic){
    noaEnhancedBasic(b, actor, target, true);
    return;
  }

  if(target.sid){
    const dmg = skill.dmg + (actor.atkBonus||0);
    target.hp = Math.max(0, target.hp - dmg);
    addBattleLog(b, `【${actor.name}】攻击式神【${target.name}】-${dmg}`, 'damage');
    checkShikiDeath(b);
  } else if(target === b.mahoraga){
    damageMahoraga(b, skill.dmg + (actor.atkBonus||0));
  } else {
    executeSkill(b, actor, skill, target);
  }

  selectedTargetKey = null;
  if(!b.over){
    if(actor.isFushiguro) resolveShikiTurn(b, actor);
    petrifyTick(b, actor);
    afterYutaAction(b, actor);
    endTurnStatuses(actor);
    advanceTurn(b);
    
    const nextKey = b.order[b.turnIndex];
    if(b.isBoss && nextKey === 'boss'){
      setTimeout(() => {
        bossAct(b);
        if(!b.over){
          advanceTurn(b);
          const nc = findChar(b, b.order[b.turnIndex]);
          if(nc && nc.hp>0) startTurn(b, nc);
        }
        renderBattle(b, null, true);
      }, 700);
      return;
    }
    
    const nxt = findChar(b, b.order[b.turnIndex]);
    if(nxt && nxt.hp>0) startTurn(b, nxt);
    if(b.mahoraga && b.mahoraga.hp > 0) mahoragaTurn(b);
  }
  renderBattle(b, null, true);
  afterSingleAdvance(b);
}

function afterSingleAdvance(b){
  if(b.over){ renderBattle(b, null, true); return; }
  const cur = findChar(b, b.order[b.turnIndex]);
  if(cur.side === 'blue' && cur.hp > 0 && !cur.isBoss){
    setTimeout(() => {
      if(b.over) return;
      const a = findChar(b, b.order[b.turnIndex]);
      if(a.side !== 'blue' || a.hp <= 0) return;
      aiAct(b, a);
      renderBattle(b, null, true);
      afterSingleAdvance(b);
    }, 650);
  }
}

function aiAct(b, actor){
  if(actor.isOOO && actor.isBerserk) {
    const allTargets = [...b.red, ...b.blue, ...(b.boss ? [b.boss] : [])].filter(c => c.hp > 0);
    const target = allTargets[Math.floor(Math.random()*allTargets.length)];
    executeSkill(b, actor, actor.skills[0], target);
    if(!b.over){
      afterYutaAction(b, actor);
      endTurnStatuses(actor);
      advanceTurn(b);
      const nc = findChar(b, b.order[b.turnIndex]);
      if(nc && nc.hp>0) startTurn(b, nc);
      if(b.mahoraga && b.mahoraga.hp>0) mahoragaTurn(b);
    }
    return;
  }

  const en = aliveList(b, 'red');
  if(!en.length) return;

  let target = null;
  const tamedSummons = b.summons ? b.summons.filter(s => s.hp>0 && s.tamed && s.side !== actor.side) : [];
  if(tamedSummons.length && rnd() < 50){
    target = tamedSummons[Math.floor(Math.random()*tamedSummons.length)];
  } else {
    target = en.reduce((x,y) => x.hp<=y.hp ? x : y);
  }

  let chosen = null;
  if(actor.statuses.some(s => s.id==='panic' && s.dur>0) || (actor.isYuji && actor.ritualLock>0)){
    chosen = actor.skills[0];
  } else if(actor.isOOO) {
    if (actor.oooForm === 'eternal') {
      if (actor.rage >= 100) chosen = actor.skills.find(s=>s.id==='ult1');
      if (!chosen) chosen = actor.skills.find(s=>s.id==='s3' && s.currentCd===0);
      if (!chosen) chosen = actor.skills[0];
    } else {
      if (actor.rage >= 100 && actor.skills.find(s=>s.id==='ult').currentCd === 0) chosen = actor.skills.find(s=>s.id==='ult');
      if (!chosen) chosen = actor.skills.find(s=>s.id==='s3' && s.currentCd===0);
      if (!chosen) chosen = actor.skills[0];
    }
  } else if(actor.isFushiguro){
    if(!actor.shadowHide && (!b.summons || b.summons.filter(s=>s.ownerKey===actor.key&&s.hp>0&&s.tamed).length < getSummonLimit(actor))){
      const available = Object.values(SHIKI_DB);
      const pick = available[Math.floor(Math.random()*available.length)];
      summonShiki(b, actor, pick.id);
      gainRage(actor, 20);
      resolveShikiTurn(b, actor);
      if(!b.over){ afterYutaAction(b, actor); endTurnStatuses(actor); advanceTurn(b); const nc = findChar(b, b.order[b.turnIndex]); if(nc && nc.hp>0) startTurn(b, nc); if(b.mahoraga && b.mahoraga.hp>0) mahoragaTurn(b); }
      return;
    }
    const u = actor.skills.find(s=>s.ult && actor.rage >= s.cost);
    if(u) chosen = u;
    if(!chosen){ const sk2 = actor.skills.find(s=>s.shadowBind && s.currentCd===0); if(sk2) chosen = sk2; }
    if(!chosen) chosen = actor.skills[0];
  } else if(actor.isGatan){
    if(actor.gatanDomainTurns === 0){
      const domain = actor.skills.find(s=>s.gatanDomain && s.currentCd===0);
      if(domain) chosen = domain;
    }
    if(!chosen){ const u = actor.skills.find(s=>s.gatanUlt && actor.rage >= s.cost); if(u) chosen = u; }
    if(!chosen){ const t = actor.skills.find(s=>s.gatanTentacle && s.currentCd===0); if(t) chosen = t; }
    if(!chosen) chosen = actor.skills[0];
  } else if(actor.isNoa){
    if(actor.nextBasic) chosen = actor.skills.find(s=>s.noaBasic);
    else {
      const u = actor.skills.find(s=>s.noaHellfire && actor.rage >= s.cost);
      if(u) chosen = u;
      if(!chosen){ const g = actor.skills.find(s=>s.noaGravity && s.currentCd===0); if(g) chosen = g; }
      if(!chosen){ const bl = actor.skills.find(s=>s.noaBlizzard && s.currentCd===0); if(bl) chosen = bl; }
      if(!chosen) chosen = actor.skills[0];
    }
  } else if(actor.isYuta) {
    if (actor.riikaTurns > 0) {
      const u1 = actor.skills.find(s=>s.yutaUlt1 && actor.rage >= s.cost);
      if (u1) chosen = u1;
      if (!chosen) { const s2 = actor.skills.find(s=>s.yutaSeal && s.currentCd===0); if(s2) chosen = s2; }
    } else {
      const riika = actor.skills.find(s=>s.yutaRiika && s.currentCd===0);
      if (riika) chosen = riika;
      else if (actor.rage >= 100) chosen = actor.skills.find(s=>s.yutaUlt2);
      else chosen = actor.skills[0];
    }
    if (!chosen) chosen = actor.skills[0];
  } else if(actor.isZaki) {
    if (actor.zakiDestoryTurns > 0) {
      const l = actor.skills.find(s=>s.zakiLightning && actor.rage >= s.cost);
      if (l) chosen = l;
    }
    if (!chosen) {
      const d = actor.skills.find(s=>s.zakiDomain && actor.rage >= s.cost);
      if (d) chosen = d;
      if (!chosen) { const s3 = actor.skills.find(s=>s.zakiDestory && s.currentCd===0); if (s3) chosen = s3; }
      if (!chosen) { const s1 = actor.skills.find(s=>s.s1 && s.currentCd===0); if (s1) chosen = s1; }
    }
    if (!chosen) chosen = actor.skills[0];
  } else {
    const ult = actor.skills.find(s => s.ult && actor.rage >= s.cost && s.currentCd===0 && (!s.yujiDomain || (actor.domainUnlocked && actor.domainCd===0)));
    if(ult) chosen = ult;
    if(!chosen && actor.hp < actor.maxHp*0.4){
      const h = actor.skills.find(s => s.heal>0 && s.currentCd===0);
      if(h) chosen = h;
    }
    if(!chosen){
      const dmg = actor.skills.filter(s => !s.ult && s.dmg>0 && s.currentCd===0 && (!s.curseCost || actor.curse>=s.curseCost));
      if(dmg.length) chosen = dmg[0];
    }
    if(!chosen){
      const o = actor.skills.find(s => !s.ult && s.cd>0 && s.currentCd===0);
      if(o) chosen = o;
    }
    if(!chosen) chosen = actor.skills[0];
  }

  if(actor.isNoa && actor.nextBasic && chosen && chosen.noaBasic){
    noaEnhancedBasic(b, actor, target, false);
    return;
  }

  if(target.sid){
    const dmg = chosen.dmg + (actor.atkBonus||0);
    target.hp = Math.max(0, target.hp - dmg);
    addBattleLog(b, `【${actor.name}】攻击式神【${target.name}】-${dmg}`, 'damage');
    checkShikiDeath(b);
  } else if(target === b.mahoraga){
    damageMahoraga(b, chosen.dmg + (actor.atkBonus||0));
  } else {
    executeSkill(b, actor, chosen, target);
  }

  if(!b.over){
    if(actor.isFushiguro) resolveShikiTurn(b, actor);
    petrifyTick(b, actor);
    afterYutaAction(b, actor);
    endTurnStatuses(actor);
    advanceTurn(b);
    const nc = findChar(b, b.order[b.turnIndex]);
    if(nc && nc.hp>0) startTurn(b, nc);
    if(b.mahoraga && b.mahoraga.hp > 0) mahoragaTurn(b);
  }
}

function startBossBattle(redIds, bossType){
  $('singleSelectScreen').classList.add('hidden');
  $('battleScreen').classList.remove('hidden');
  const red = redIds.map((id,i) => baseChar(CHAR_DB[id], 'red_'+i, 'red'));
  const blue = [];
  const boss = makeBoss(bossType);
  const order = red.map(c=>c.key);
  order.push('boss');
  
  localBattle = { red, blue, boss, order, turnIndex:-1, over:false, winner:'', logs:[], summons:[], mahoraga:null, mahoragaTamed:false, isBoss:true };
  selectedTargetKey = null;
  $('log').innerHTML = '';
  $('result').className = 'result';
  addBattleLog(localBattle, 'Boss战开始！击败敌人！', 'info');
  
  advanceTurn(localBattle);
  const cur = findChar(localBattle, localBattle.order[localBattle.turnIndex]);
  if(cur && cur.hp>0) startTurn(localBattle, cur);
  renderBattle(localBattle, null, true);
  
  if(localBattle.order[localBattle.turnIndex] === 'boss'){
    setTimeout(()=>{ bossAct(localBattle); renderBattle(localBattle, null, true); afterSingleAdvance(localBattle); }, 800);
  } else {
    afterSingleAdvance(localBattle);
  }
}
