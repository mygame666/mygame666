  mode = 'boss';
  currentBossMode = 'shengzhu';
  $('menuScreen').classList.add('hidden');
  $('singleSelectScreen').classList.remove('hidden');
  $('singleSelectTitle').textContent = '选择 3 名角色挑战 Boss 恶魔圣主';
  $('singleHint').textContent = '圣主免疫控制、伤害极高、无视防御';
  singleSelectedIds = [];
  renderSingleSelect();
};

function renderSingleSelect(){
  const grid = $('singleSelectGrid');
  grid.innerHTML = '';
  ALL_IDS.forEach(id => {
    const c = CHAR_DB[id];
    const card = document.createElement('div');
    card.className = 'pick-card' + (singleSelectedIds.includes(id)?' selected':'');
    card.innerHTML = `<span class="check">✓</span><div class="name">${c.name}</div><span class="type">${c.type}</span><div class="desc">HP ${c.hp}<br>${c.desc}</div>`;
    card.onclick = () => {
      if(singleSelectedIds.includes(id)) singleSelectedIds = singleSelectedIds.filter(x => x!==id);
      else { if(singleSelectedIds.length>=3) return; singleSelectedIds.push(id); }
      renderSingleSelect();
    };
    grid.appendChild(card);
  });
  $('singleSelectInfo').textContent = `已选 ${singleSelectedIds.length} / 3`;
  $('singleStartBtn').disabled = singleSelectedIds.length !== 3;
}

$('singleStartBtn').onclick = () => {
  if(singleSelectedIds.length!==3) return;
  if(mode === 'boss'){
    startBossBattle(singleSelectedIds, currentBossMode);
  } else {
    const aiIds = ALL_IDS.filter(id => !singleSelectedIds.includes(id)).slice(0,3);
    startSingleBattle(singleSelectedIds, aiIds);
  }
};

function startSingleBattle(redIds, blueIds){
  $('singleSelectScreen').classList.add('hidden');
  $('battleScreen').classList.remove('hidden');
  const red = redIds.map((id,i) => baseChar(CHAR_DB[id], 'red_'+i, 'red'));
  const blue = blueIds.map((id,i) => baseChar(CHAR_DB[id], 'blue_'+i, 'blue'));
  const order = [];
  for(let i=0;i<3;i++){ order.push('red_'+i); order.push('blue_'+i); }
  localBattle = { red, blue, order, turnIndex:-1, over:false, winner:'', logs:[], summons:[], mahoraga:null, mahoragaTamed:false, isBoss:false, boss:null };
  selectedTargetKey = null;
  $('log').innerHTML = '';
  $('result').className = 'result';
  addBattleLog(localBattle, '战斗开始！红方先手。', 'info');
  advanceTurn(localBattle);
  const cur = findChar(localBattle, localBattle.order[localBattle.turnIndex]);
  if(cur && cur.hp>0) startTurn(localBattle, cur);
  renderBattle(localBattle, null, true);
  afterSingleAdvance(localBattle);
}

$('onlineBtn').onclick = () => {
  mode = 'online';
  $('menuScreen').classList.add('hidden');
  $('onlineLobbyScreen').classList.remove('hidden');
  if(mqttClient) { try{mqttClient.end();}catch(e){} mqttClient = null; }
  connectMQTT();
};

function connectMQTT(){
  if(typeof mqtt === 'undefined'){ $('lobbyMsg').textContent = 'MQTT 库加载失败'; return; }
  $('lobbyMsg').textContent = '正在连接 MQTT 服务器...';
  mqttClient = mqtt.connect(MQTT_URL, { clientId: 'jlx_'+Math.random().toString(16).substr(2,8), clean:true, connectTimeout:8000, reconnectPeriod:3000 });
  mqttClient.on('connect', () => { $('lobbyMsg').textContent = 'MQTT 已连接，可创建/加入房间'; });
  mqttClient.on('error', (err) => { $('lobbyMsg').textContent = 'MQTT 连接失败：' + err.message; });
  mqttClient.on('message', (topic, payload) => {
    try { handleMqttMessage(JSON.parse(payload.toString())); } catch(e){}
  });
}

function mqttPublish(msg){ if(mqttClient && mqttClient.connected) mqttClient.publish(TOPIC(roomCode), JSON.stringify(msg), {qos:1}); }
function mqttSubscribe(){ if(mqttClient && mqttClient.connected) mqttClient.subscribe(TOPIC(roomCode), {qos:1}); }

$('pvpBtn').onclick = () => {
  if(!mqttClient || !mqttClient.connected){ $('lobbyMsg').textContent = 'MQTT 未连接'; return; }
  roomCode = Math.floor(1000 + Math.random()*9000).toString();
  mySide = 'red';
  net = { phase:'selecting', mode:'pvp', redSelect:null, blueSelect:null, battle:null };
  mqttSubscribe();
  $('onlineLobbyScreen').classList.add('hidden');
  $('onlineSelectScreen').classList.remove('hidden');
  $('roomIdDisplay').textContent = roomCode;
  $('onlineSideTitle').textContent = '你是红方 · 选择 3 名角色';
  $('onlineWaitHint').textContent = '等待蓝方加入...';
  onlineSelectedIds = [];
  renderOnlineSelect();
};

$('bossCoopBtn').onclick = () => {
  if(!mqttClient || !mqttClient.connected){ $('lobbyMsg').textContent = 'MQTT 未连接'; return; }
  roomCode = Math.floor(1000 + Math.random()*9000).toString();
  mySide = 'red';
  net = { phase:'selecting', mode:'boss', redSelect:null, blueSelect:null, battle:null };
  mqttSubscribe();
  $('onlineLobbyScreen').classList.add('hidden');
  $('onlineSelectScreen').classList.remove('hidden');
  $('roomIdDisplay').textContent = roomCode;
  $('onlineSideTitle').textContent = '你是红方 · 选择 1 名角色';
  $('onlineWaitHint').textContent = '等待蓝方加入...';
  onlineSelectedIds = [];
  renderOnlineSelect();
};

$('joinBtn').onclick = () => {
  if(!mqttClient || !mqttClient.connected){ $('lobbyMsg').textContent = 'MQTT 未连接'; return; }
  const code = $('roomInput').value.trim();
  if(!/^\d{4}$/.test(code)){ $('lobbyMsg').textContent = '请输入4位房间码'; return; }
  roomCode = code;
  mySide = 'blue';
  mqttSubscribe();
  $('onlineLobbyScreen').classList.add('hidden');
  $('onlineSelectScreen').classList.remove('hidden');
  $('roomIdDisplay').textContent = roomCode;
  $('onlineSideTitle').textContent = net.mode === 'boss' ? '你是蓝方 · 选择 1 名角色' : '你是蓝方 · 选择 3 名角色';
  $('onlineWaitHint').textContent = '等待房主开始...';
  onlineSelectedIds = [];
  renderOnlineSelect();
};

function renderOnlineSelect(){
  const grid = $('onlineSelectGrid');
  if(!grid) return;
  grid.innerHTML = '';
  const maxCount = net.mode === 'boss' ? 1 : 3;
  ALL_IDS.forEach(id => {
    const c = CHAR_DB[id];
    const card = document.createElement('div');
    card.className = 'pick-card' + (onlineSelectedIds.includes(id)?' selected':'');
    card.innerHTML = `<span class="check">✓</span><div class="name">${c.name}</div><span class="type">${c.type}</span><div class="desc">HP ${c.hp}<br>${c.desc}</div>`;
    card.onclick = () => {
      if(net.mode === 'boss'){
        onlineSelectedIds = [id];
      } else {
        if(onlineSelectedIds.includes(id)) onlineSelectedIds = onlineSelectedIds.filter(x => x!==id);
        else { if(onlineSelectedIds.length>=3) return; onlineSelectedIds.push(id); }
      }
      renderOnlineSelect();
    };
    grid.appendChild(card);
  });
  $('onlineSelectInfo').textContent = `已选 ${onlineSelectedIds.length} / ${maxCount}`;
  $('onlineConfirmBtn').disabled = onlineSelectedIds.length !== maxCount;
}

$('onlineConfirmBtn').onclick = () => {
  const maxCount = net.mode === 'boss' ? 1 : 3;
  if(onlineSelectedIds.length !== maxCount) return;
  if(mySide === 'red'){
    net.redSelect = [...onlineSelectedIds];
    mqttPublish({type:'state', roomCode, net});
    tryStartBattleAsHost();
  } else {
    mqttPublish({type:'guestSelect', roomCode, ids:[...onlineSelectedIds]});
  }
  $('onlineConfirmBtn').disabled = true;
  $('onlineSelectInfo').textContent = '已确认，等待对方...';
};

function handleMqttMessage(msg){
  if(msg.roomCode !== roomCode) return;
  if(msg.type === 'state' && msg.net){
    net = msg.net;
    if(net.phase === 'battle' && net.battle){
      $('onlineSelectScreen').classList.add('hidden');
      $('battleScreen').classList.remove('hidden');
      renderBattle(net.battle, mySide, false);
    }
  }
  if(msg.type === 'guestSelect' && mySide === 'red'){
    net.blueSelect = msg.ids;
    tryStartBattleAsHost();
  }
  if(msg.type === 'guestAction' && mySide === 'red'){
    handleOnlineActionAsHost('blue', msg.skillId, msg.targetKey);
  }
}

function tryStartBattleAsHost(){
  if(mySide !== 'red' || !net.redSelect || !net.blueSelect || net.battle) return;
  const red = net.redSelect.map((id,i) => baseChar(CHAR_DB[id], 'red_'+i, 'red'));
  const blue = net.blueSelect.map((id,i) => baseChar(CHAR_DB[id], 'blue_'+i, 'blue'));
  
  let battle;
  if(net.mode === 'boss'){
    const bossType = Math.random() < 0.5 ? 'broly' : 'shengzhu';
    const boss = makeBoss(bossType);
    const order = [...red.map(c=>c.key), ...blue.map(c=>c.key), 'boss'];
    battle = { red, blue, boss, order, turnIndex:-1, over:false, winner:'', logs:[], summons:[], mahoraga:null, mahoragaTamed:false, isBoss:true };
    addBattleLog(battle, `Boss合作开始！${boss.name}登场！`, 'revive');
  } else {
    const order = [];
    for(let i=0;i<3;i++){ order.push('red_'+i); order.push('blue_'+i); }
    battle = { red, blue, order, turnIndex:-1, over:false, winner:'', logs:[], summons:[], mahoraga:null, mahoragaTamed:false, isBoss:false, boss:null };
    addBattleLog(battle, '战斗开始！红方先手。', 'info');
  }
  
  net.battle = battle;
  net.phase = 'battle';
  advanceTurn(net.battle);
  const cur = findChar(net.battle, net.battle.order[net.battle.turnIndex]);
  if(cur && cur.hp>0) startTurn(net.battle, cur);
  $('onlineSelectScreen').classList.add('hidden');
  $('battleScreen').classList.remove('hidden');
  renderBattle(net.battle, mySide, false);
  mqttPublish({type:'state', roomCode, net});
  
  if(net.battle.isBoss && net.battle.order[net.battle.turnIndex] === 'boss'){
    setTimeout(()=>{ bossAct(net.battle); renderBattle(net.battle, mySide, false); mqttPublish({type:'state', roomCode, net}); }, 800);
  }
}

function onlinePerformAction(b, actor, skill){
  if(!b || b.over) return;
  if(actor.side !== mySide) return;
  if(mySide === 'red'){
    handleOnlineActionAsHost('red', skill.id, selectedTargetKey);
  } else {
    mqttPublish({type:'guestAction', roomCode, skillId: skill.id, targetKey: selectedTargetKey});
  }
  selectedTargetKey = null;
}

function handleOnlineActionAsHost(side, skillId, targetKey){
  const b = net.battle;
  if(!b || b.over) return;
  const cur = findChar(b, b.order[b.turnIndex]);
  if(!cur || cur.hp<=0 || cur.side!==side) return;
  const skill = cur.skills.find(s => s.id===skillId);
  if(!skill || skill.currentCd>0) return;

  if(skill.summonShiki){
    const available = Object.values(SHIKI_DB);
    const pick = available[Math.floor(Math.random()*available.length)];
    summonShiki(b, cur, pick.id);
    gainRage(cur, 20);
  } else if (skill.copy) {
    const allTargets = [...b.red, ...b.blue, ...(b.boss ? [b.boss] : [])].filter(c => c.hp > 0);
    const randomChar = allTargets[Math.floor(Math.random()*allTargets.length)];
    const validSkills = randomChar.skills.filter(s => !s.copy);
    const randSkill = validSkills[Math.floor(Math.random()*validSkills.length)];
    
    let copiedSkill = { ...randSkill, currentCd: 0 };
    if (copiedSkill.ult && cur.yutaDomainTurns > 0) copiedSkill.cost = 0;
    
    addBattleLog(b, `【联机】${cur.name} 复制了 ${randSkill.name}`, 'passive');
    executeSkill(b, cur, copiedSkill, pickTarget(b, cur.side));
  } else {
    if(skill.cost>0 && cur.rage<skill.cost) return;
    let target;
    if(targetKey === 'boss' && b.boss && b.boss.hp > 0) target = b.boss;
    else if(targetKey) target = findChar(b, targetKey);
    
    const en = aliveList(b, side==='red'?'blue':'red');
    if(b.isBoss && b.boss && b.boss.hp>0 && side==='red') en.push(b.boss);
    
    if(!target || target.hp<=0 || target.side===side) target = en[0];
    if(!target) return;

    if(cur.isNoa && cur.nextBasic && skill.noaBasic){
      noaEnhancedBasic(b, cur, target, false);
      mqttPublish({type:'state', roomCode, net});
      return;
    }
    executeSkill(b, cur, skill, target);
  }

  if(!b.over){
    if(cur.isFushiguro) resolveShikiTurn(b, cur);
    petrifyTick(b, cur);
    afterYutaAction(b, cur);
    endTurnStatuses(cur);
    advanceTurn(b);
    
    const nextKey = b.order[b.turnIndex];
    if(b.isBoss && nextKey === 'boss'){
      setTimeout(() => {
        bossAct(b);
        if(!b.over){
          advanceTurn(b);
          const n = findChar(b, b.order[b.turnIndex]);
          if(n && n.hp>0) startTurn(b, n);
        }
        renderBattle(b, mySide, false);
        mqttPublish({type:'state', roomCode, net});
      }, 700);
      return;
    }
    
    const next = findChar(b, b.order[b.turnIndex]);
    if(next && next.hp>0) startTurn(b, next);
    if(b.mahoraga && b.mahoraga.hp > 0) mahoragaTurn(b);
  }
  renderBattle(b, mySide, false);
  mqttPublish({type:'state', roomCode, net});
}
